api_version: axern/v1
kind: Function
metadata:
  name: hello
  namespace: default
  labels: {}
spec:
  source:
    template: python311
  resources:
    requests:
      cpu: 600m
      memory: 512MiB
    limits:
      cpu: "1"
      memory: 1GiB
  env:
    GREETING: hello
  function:
    runtime: python3.11
    handler: handler.hello
    initializer: handler.init
    source: src
    timeout_seconds: 600
    scaling:
      min_replicas: 0
      max_replicas: 10
      concurrency: 2
      idle_timeout: 5m
