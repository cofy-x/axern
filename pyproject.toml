[project]
name = "axern"
version = "0.5.1"
description = "Open-source agentic infrastructure for running AI agents in isolated, stateful sandboxes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.urls]
Homepage = "https://github.com/cofy-x/axern"
Repository = "https://github.com/cofy-x/axern"
Issues = "https://github.com/cofy-x/axern/issues"

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["sdk/python"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
