# Source-development overrides. Build the images with `make local-images-build`
# before installing the chart with this file.
controld:
  image:
    repository: axern/local-controld
    tag: dev

tunneld:
  image:
    repository: axern/local-tunneld
    tag: dev

node:
  enrollment:
    nodes: [] # Explicit records: {nodeName: worker-a, nodeID: independently-assigned-id}
    existingSecret: enrollment-token
  image:
    repository: axern/local-node-all-in-one
    tag: dev
  # Local validation only: 512 MiB for runtime conformance plus explicit
  # axnoded headroom. Production values must come from qualification.
  memorySystemReserveBytes: "1073741824"

gatewayd:
  image:
    repository: axern/local-gatewayd
    tag: dev
