{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "axern.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axern.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "axern.scheduling" (dict "root" . "profile" "platform" "component" "minio" "spread" true) | nindent 6 }}
      containers:
        - name: minio
          image: {{ include "axern.image" (dict "root" . "image" .Values.minio.image) | quote }}
          imagePullPolicy: {{ include "axern.pullPolicy" (dict "root" . "image" .Values.minio.image) }}
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default "minio" .Values.minio.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  selector:
    {{- include "axern.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "minio-create-bucket") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        {{- include "axern.componentSelectorLabels" (dict "root" . "component" "minio-create-bucket") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: {{ include "axern.image" (dict "root" . "image" .Values.minio.clientImage) | quote }}
          imagePullPolicy: {{ include "axern.pullPolicy" (dict "root" . "image" .Values.minio.clientImage) }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set axern http://minio.{{ .Release.Namespace }}.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing "axern/$MINIO_BUCKET"
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.minio.bucket | quote }}
{{- if and .Values.minio.persistence.enabled (not .Values.minio.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.minio.persistence.storageClassName }}
  storageClassName: {{ .Values.minio.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size | quote }}
{{- end }}
{{- end }}
