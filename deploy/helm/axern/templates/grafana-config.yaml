{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
data:
  dashboards.yaml: |
{{ .Files.Get "files/grafana/provisioning/dashboards/axern.yaml" | indent 4 }}
  datasources.yaml: |
{{ .Files.Get "files/grafana/provisioning/datasources/axern.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
data:
  axern-core.json: |
{{ .Files.Get "files/grafana/dashboards/axern-core.json" | indent 4 }}
  axern-node-resources.json: |
{{ .Files.Get "files/grafana/dashboards/axern-node-resources.json" | indent 4 }}
  axern-image-distribution.json: |
{{ .Files.Get "files/grafana/dashboards/axern-image-distribution.json" | indent 4 }}
{{- end }}
