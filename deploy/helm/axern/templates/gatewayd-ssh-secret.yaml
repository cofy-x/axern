{{- if and .Values.gatewayd.ssh.enabled (not .Values.gatewayd.ssh.existingSecret) (not (lookup "v1" "Secret" .Release.Namespace .Values.gatewayd.ssh.secretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gatewayd.ssh.secretName }}
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "gatewayd") | nindent 4 }}
type: Opaque
stringData:
  gateway_host_ed25519: |
{{ default (genPrivateKey "ed25519") .Values.gatewayd.ssh.hostKey | indent 4 }}
  authorized_keys: |
{{ default "# No SSH client keys configured.\n" .Values.gatewayd.ssh.authorizedKeys | indent 4 }}
{{- end }}
