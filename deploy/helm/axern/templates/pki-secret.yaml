{{- if and .Values.pki.enabled (not .Values.pki.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.pki.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pki.secretName }}
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "pki") | nindent 4 }}
type: Opaque
{{- if $existing }}
data:
  ca.crt: {{ required "existing PKI secret is missing ca.crt" (index $existing.data "ca.crt") | quote }}
  controld.crt: {{ required "existing PKI secret is missing controld.crt" (index $existing.data "controld.crt") | quote }}
  controld.key: {{ required "existing PKI secret is missing controld.key" (index $existing.data "controld.key") | quote }}
  gatewayd.crt: {{ required "existing PKI secret is missing gatewayd.crt" (index $existing.data "gatewayd.crt") | quote }}
  gatewayd.key: {{ required "existing PKI secret is missing gatewayd.key" (index $existing.data "gatewayd.key") | quote }}
  tunneld.crt: {{ required "existing PKI secret is missing tunneld.crt" (index $existing.data "tunneld.crt") | quote }}
  tunneld.key: {{ required "existing PKI secret is missing tunneld.key" (index $existing.data "tunneld.key") | quote }}
  client.crt: {{ required "existing PKI secret is missing client.crt" (index $existing.data "client.crt") | quote }}
  client.key: {{ required "existing PKI secret is missing client.key" (index $existing.data "client.key") | quote }}
  node.crt: {{ required "existing PKI secret is missing node.crt" (index $existing.data "node.crt") | quote }}
  node.key: {{ required "existing PKI secret is missing node.key" (index $existing.data "node.key") | quote }}
{{- else }}
{{- $ca := genCA "axern-ca" (int .Values.pki.durationDays) }}
{{- $loopbackIPs := list "127.0.0.1" }}
{{- $controlDNS := concat (list "localhost" "host.docker.internal" "controld" (printf "controld.%s" .Release.Namespace) (printf "controld.%s.svc" .Release.Namespace) (printf "controld.%s.svc.cluster.local" .Release.Namespace)) (default (list) .Values.pki.control.extraDNSNames) }}
{{- $controlIPs := concat $loopbackIPs (default (list) .Values.pki.control.extraIPAddresses) }}
{{- $gatewayDNS := concat (list "localhost" "host.docker.internal" "gatewayd" (printf "gatewayd.%s" .Release.Namespace) (printf "gatewayd.%s.svc" .Release.Namespace) (printf "gatewayd.%s.svc.cluster.local" .Release.Namespace)) (default (list) .Values.pki.gateway.extraDNSNames) }}
{{- $gatewayIPs := concat $loopbackIPs (default (list) .Values.pki.gateway.extraIPAddresses) }}
{{- $tunnelDNS := concat (list "localhost" "host.docker.internal" "tunneld" (printf "tunneld.%s" .Release.Namespace) (printf "tunneld.%s.svc" .Release.Namespace) (printf "tunneld.%s.svc.cluster.local" .Release.Namespace)) (default (list) .Values.pki.tunnel.extraDNSNames) }}
{{- $tunnelIPs := concat $loopbackIPs (default (list) .Values.pki.tunnel.extraIPAddresses) }}
{{- $controlServer := genSignedCert "controld" $controlIPs $controlDNS (int .Values.pki.durationDays) $ca }}
{{- $gatewayServer := genSignedCert "gatewayd" $gatewayIPs $gatewayDNS (int .Values.pki.durationDays) $ca }}
{{- $tunnelServer := genSignedCert "tunneld" $tunnelIPs $tunnelDNS (int .Values.pki.durationDays) $ca }}
{{- $client := genSignedCert "axern-client" nil nil (int .Values.pki.durationDays) $ca }}
{{- $node := genSignedCert "axern-node" nil nil (int .Values.pki.durationDays) $ca }}
stringData:
  ca.crt: |
{{ $ca.Cert | indent 4 }}
  controld.crt: |
{{ $controlServer.Cert | indent 4 }}
  controld.key: |
{{ $controlServer.Key | indent 4 }}
  gatewayd.crt: |
{{ $gatewayServer.Cert | indent 4 }}
  gatewayd.key: |
{{ $gatewayServer.Key | indent 4 }}
  tunneld.crt: |
{{ $tunnelServer.Cert | indent 4 }}
  tunneld.key: |
{{ $tunnelServer.Key | indent 4 }}
  client.crt: |
{{ $client.Cert | indent 4 }}
  client.key: |
{{ $client.Key | indent 4 }}
  node.crt: |
{{ $node.Cert | indent 4 }}
  node.key: |
{{ $node.Key | indent 4 }}
{{- end }}
{{- end }}
