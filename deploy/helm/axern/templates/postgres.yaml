{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "axern.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axern.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "axern.scheduling" (dict "root" . "profile" "platform" "component" "postgres" "spread" true) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "axern.image" (dict "root" . "image" .Values.postgres.image) | quote }}
          imagePullPolicy: {{ include "axern.pullPolicy" (dict "root" . "image" .Values.postgres.image) }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "axern.postgresSecretName" . }}
                  key: {{ .Values.postgres.passwordKey }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default "postgres" .Values.postgres.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "axern.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
{{- if and .Values.postgres.persistence.enabled (not .Values.postgres.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgres.persistence.storageClassName }}
  storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
{{- end }}
