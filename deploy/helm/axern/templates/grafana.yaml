{{- if .Values.observability.enabled }}
{{- if and .Values.observability.grafana.persistence.enabled (ne (int .Values.observability.grafana.replicas) 1) }}
{{- fail "observability.grafana.replicas must be 1 when Grafana persistence is enabled" }}
{{- end }}
{{- if and (not .Values.observability.grafana.admin.existingSecret) (not .Values.observability.grafana.admin.password) }}
{{- fail "observability.grafana.admin.existingSecret or a non-empty admin.password is required" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
spec:
  replicas: {{ .Values.observability.grafana.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "axern.componentSelectorLabels" (dict "root" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axern.componentSelectorLabels" (dict "root" . "component" "grafana") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" (include (print $.Template.BasePath "/grafana-config.yaml") .) (toJson .Values.observability.grafana) | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "axern.scheduling" (dict "root" . "profile" "observability" "component" "grafana" "spread" true) | nindent 6 }}
      securityContext: {fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: grafana
          image: {{ include "axern.image" (dict "root" . "image" .Values.observability.grafana.image) | quote }}
          imagePullPolicy: {{ include "axern.pullPolicy" (dict "root" . "image" .Values.observability.grafana.image) }}
          ports: [{name: http, containerPort: 3000}]
          env:
            - name: GF_SECURITY_ADMIN_USER
              {{- if .Values.observability.grafana.admin.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.grafana.admin.existingSecret | quote }}
                  key: {{ .Values.observability.grafana.admin.userKey | quote }}
              {{- else }}
              value: {{ .Values.observability.grafana.admin.user | quote }}
              {{- end }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              {{- if .Values.observability.grafana.admin.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.grafana.admin.existingSecret | quote }}
                  key: {{ .Values.observability.grafana.admin.passwordKey | quote }}
              {{- else }}
              value: {{ .Values.observability.grafana.admin.password | quote }}
              {{- end }}
            - {name: GF_PATHS_DATA, value: /var/lib/grafana}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_PLUGINS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
          readinessProbe: {httpGet: {path: /api/health, port: http}}
          livenessProbe: {httpGet: {path: /api/health, port: http}}
          resources:
            {{- toYaml .Values.observability.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards/axern, readOnly: true}
      volumes:
        - name: data
          {{- if .Values.observability.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default "grafana" .Values.observability.grafana.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
spec:
  type: {{ .Values.observability.grafana.service.type }}
  selector:
    {{- include "axern.componentSelectorLabels" (dict "root" . "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- if and (eq .Values.observability.grafana.service.type "NodePort") .Values.observability.grafana.service.uiNodePort }}
      nodePort: {{ .Values.observability.grafana.service.uiNodePort }}
      {{- end }}
{{- if and .Values.observability.grafana.persistence.enabled (not .Values.observability.grafana.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.observability.grafana.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.observability.grafana.persistence.size }}}
{{- end }}
{{- end }}
