{{- if not .Values.postgres.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.postgres.secretName }}
{{- $password := .Values.postgres.password }}
{{- if and (not $password) $existing }}
{{- $password = default "" (get $existing.data .Values.postgres.passwordKey) | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- $dsn := .Values.postgres.dsn }}
{{- if not $dsn }}
{{- $dsn = printf "postgres://%s:%s@postgres:5432/%s?sslmode=disable" .Values.postgres.username $password .Values.postgres.database }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.secretName }}
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.passwordKey }}: {{ $password | quote }}
  {{ .Values.postgres.dsnKey }}: {{ $dsn | quote }}
{{- end }}
