{{- if not .Values.secrets.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretName }}
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
{{- if $existing }}
data:
  AXERN_SECRETS_MASTER_KEY: {{ default (randAlphaNum 32 | b64enc) (get $existing.data "AXERN_SECRETS_MASTER_KEY") | quote }}
  CONTROLD_ROLLOUT_WORKER_TOKEN: {{ default (randAlphaNum 48 | b64enc) (get $existing.data "CONTROLD_ROLLOUT_WORKER_TOKEN") | quote }}
  CONTROLD_ARTIFACT_TICKET_KEY: {{ default (randAlphaNum 48 | b64enc) (get $existing.data "CONTROLD_ARTIFACT_TICKET_KEY") | quote }}
  GATEWAYD_DEV_TOKEN: {{ default (randAlphaNum 48 | b64enc) (get $existing.data "GATEWAYD_DEV_TOKEN") | quote }}
{{- else }}
stringData:
  AXERN_SECRETS_MASTER_KEY: {{ default (randAlphaNum 32) .Values.secrets.secretsMasterKey | quote }}
  CONTROLD_ROLLOUT_WORKER_TOKEN: {{ default (randAlphaNum 48) .Values.secrets.rolloutWorkerToken | quote }}
  CONTROLD_ARTIFACT_TICKET_KEY: {{ default (randAlphaNum 48) .Values.secrets.artifactTicketKey | quote }}
  GATEWAYD_DEV_TOKEN: {{ default (randAlphaNum 48) .Values.gatewayd.devToken | quote }}
{{- end }}
{{- end }}
