{{- if not .Values.secrets.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretName }}
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
{{- if $existing }}
data:
  AXERN_SECRETS_MASTER_KEY: {{ default (randAlphaNum 32 | b64enc) (get $existing.data "AXERN_SECRETS_MASTER_KEY") | quote }}
{{- else }}
stringData:
  AXERN_SECRETS_MASTER_KEY: {{ default (randAlphaNum 32) .Values.secrets.secretsMasterKey | quote }}
{{- end }}
{{- end }}
