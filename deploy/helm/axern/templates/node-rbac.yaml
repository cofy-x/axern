{{- if .Values.node.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "axern.nodeServiceAccountName" . | quote }}
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
---
{{- end }}
{{- if eq (include "axern.nodeResourceSource" .) "kubernetes" }}
{{- if .Values.node.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-node-reader" (include "axern.fullname" .) | quote }}
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-node-reader" (include "axern.fullname" .) | quote }}
  labels:
    {{- include "axern.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-node-reader" (include "axern.fullname" .) | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "axern.nodeServiceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
{{- end }}
