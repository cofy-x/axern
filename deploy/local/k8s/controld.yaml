apiVersion: apps/v1
kind: Deployment
metadata:
  name: storaged
  namespace: axern-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storaged
  template:
    metadata:
      labels:
        app: storaged
    spec:
      containers:
        - name: storaged
          image: axern/local-controld:dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/storaged
          args:
            - -grpc-address
            - 0.0.0.0:24020
            - -http-address
            - 0.0.0.0:24021
            - -postgres-dsn
            - postgres://postgres:postgres@postgres:5432/axern?sslmode=disable
          ports:
            - containerPort: 24020
            - containerPort: 24021
          readinessProbe:
            httpGet:
              path: /healthz
              port: 24021
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: storaged
  namespace: axern-local
spec:
  selector:
    app: storaged
  ports:
    - name: grpc
      port: 24020
      targetPort: 24020
    - name: http
      port: 24021
      targetPort: 24021
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controld
  namespace: axern-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controld
  template:
    metadata:
      labels:
        app: controld
    spec:
      containers:
        - name: controld
          image: axern/local-controld:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: local-proxy-env
          args:
            - -grpc-address
            - 0.0.0.0:24000
            - -http-address
            - 0.0.0.0:24001
            - -heartbeat-freshness-window
            - 15s
            - -summary-freshness-window
            - 15s
            - -postgres-dsn
            - postgres://postgres:postgres@postgres:5432/axern?sslmode=disable
            - -tls-ca-cert
            - /certs/ca.crt
            - -tls-cert
            - /certs/controld.crt
            - -tls-key
            - /certs/controld.key
            - -storaged-target
            - storaged.axern-local.svc.cluster.local:24020
            - -function-gateway-url
            - http://gatewayd.axern-local.svc.cluster.local:25080
            - -function-gateway-token
            - axern-local-dev
            - -function-bundle-base-url
            - http://controld.axern-local.svc.cluster.local:24001
            - -function-bundle-token
            - axern-local-dev
          env:
            - name: AXERN_RUNTIME_CATALOG_PYTHON311_IMAGE
              value: axern/python311-runtime:dev
            - name: AXERN_RUNTIME_CATALOG_SERVER_BASE_IMAGE
              value: axern/server-base-runtime:dev
            - name: AXERN_RUNTIME_CATALOG_CODING_BASE_IMAGE
              value: axern/coding-base-runtime:dev
            - name: AXERN_RUNTIME_CATALOG_DESKTOP_BASE_IMAGE
              value: axern/desktop-base-runtime:dev
            - name: AXERN_AGENT_BUNDLE_CLAUDE_CODE_IMAGE
              value: axern/claude-code-bundle:dev
            - name: AXERN_AGENT_BUNDLE_CODEX_IMAGE
              value: axern/codex-bundle:dev
            - name: CONTROLD_TUNNEL_RELAYS
              value: default,127.0.0.1:25001,tunneld.axern-local.svc.cluster.local:24100,1,false
            - name: AXERN_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: controld-secrets
                  key: AXERN_SECRETS_MASTER_KEY
          ports:
            - containerPort: 24000
            - containerPort: 24001
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 24001
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: certs
          secret:
            secretName: controld-pki
---
apiVersion: v1
kind: Service
metadata:
  name: controld
  namespace: axern-local
spec:
  selector:
    app: controld
  ports:
    - name: grpc
      port: 24000
      targetPort: 24000
    - name: http
      port: 24001
      targetPort: 24001
---
apiVersion: v1
kind: Service
metadata:
  name: controld-health
  namespace: axern-local
spec:
  type: NodePort
  selector:
    app: controld
  ports:
    - name: http
      port: 24001
      targetPort: 24001
      nodePort: 30211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controld-retention
  namespace: axern-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controld-retention
  template:
    metadata:
      labels:
        app: controld-retention
    spec:
      containers:
        - name: controld-retention
          image: axern/local-controld:dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/controld-retention
          args:
            - -postgres-dsn
            - postgres://postgres:postgres@postgres:5432/axern?sslmode=disable
          env:
            - name: CONTROLD_RETENTION_ENABLED
              value: "true"
