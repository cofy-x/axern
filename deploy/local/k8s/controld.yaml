apiVersion: apps/v1
kind: Deployment
metadata:
  name: controld
  namespace: axern-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controld
  template:
    metadata:
      labels:
        app: controld
    spec:
      containers:
        - name: controld
          image: axern/local-controld:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: local-proxy-env
          args:
            - -workload-bundle
            - /certs/controld.pem
            - -workload-cluster
            - axern.local
            - -workload-signer-bundle
            - /signer/signer.pem
            - -enrollment-address
            - 0.0.0.0:24002
            - -grpc-address
            - 0.0.0.0:24000
            - -http-address
            - 0.0.0.0:24001
            - -heartbeat-freshness-window
            - 15s
            - -summary-freshness-window
            - 15s
            - -postgres-dsn
            - postgres://postgres:postgres@postgres:5432/axern?sslmode=disable
            - -tls-ca-cert
            - /certs/ca.crt
          env:
            - name: AXERN_RUNTIME_TEMPLATE_PYTHON311_IMAGE
              value: axern/python311-runtime:dev
            - name: AXERN_RUNTIME_TEMPLATE_SERVER_BASE_IMAGE
              value: axern/server-base-runtime:dev
            - name: AXERN_RUNTIME_TEMPLATE_CODING_BASE_IMAGE
              value: axern/coding-base-runtime:dev
            - name: AXERN_RUNTIME_TEMPLATE_DESKTOP_BASE_IMAGE
              value: axern/desktop-base-runtime:dev
            - name: CONTROLD_TUNNEL_RELAYS
              value: default,127.0.0.1:25001,tunneld.axern-local.svc.cluster.local:24100,1,false
            - name: AXERN_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: controld-secrets
                  key: AXERN_SECRETS_MASTER_KEY
          ports:
            - containerPort: 24000
            - containerPort: 24001
          volumeMounts:
            - name: signer
              mountPath: /signer
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 24001
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: signer
          secret:
            secretName: axern-pki-signer
            defaultMode: 384
        - name: certs
          secret:
            secretName: controld-pki
            defaultMode: 384
            items:
              - key: ca.crt
                path: ca.crt
              - key: controld.pem
                path: controld.pem
              - key: client.crt
                path: client.crt
---
apiVersion: v1
kind: Service
metadata:
  name: controld
  namespace: axern-local
spec:
  selector:
    app: controld
  ports:
    - name: enrollment
      port: 24002
      targetPort: 24002
    - name: grpc
      port: 24000
      targetPort: 24000
    - name: http
      port: 24001
      targetPort: 24001
---
apiVersion: v1
kind: Service
metadata:
  name: controld-health
  namespace: axern-local
spec:
  type: NodePort
  selector:
    app: controld
  ports:
    - name: http
      port: 24001
      targetPort: 24001
      nodePort: 30211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controld-retention
  namespace: axern-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controld-retention
  template:
    metadata:
      labels:
        app: controld-retention
    spec:
      containers:
        - name: controld-retention
          image: axern/local-controld:dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/controld-retention
          args:
            - -postgres-dsn
            - postgres://postgres:postgres@postgres:5432/axern?sslmode=disable
          env:
            - name: CONTROLD_RETENTION_ENABLED
              value: "true"
