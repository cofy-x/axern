apiVersion: batch/v1
kind: Job
metadata:
  name: controld-migrate
  namespace: axern-local
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: controld-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: controld-migrate
          image: axern/local-controld:dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              /usr/local/bin/controld-migrate -postgres-dsn 'postgres://postgres:postgres@postgres:5432/axern?sslmode=disable' up
              /usr/local/bin/controld-access-bootstrap \
                -postgres-dsn 'postgres://postgres:postgres@postgres:5432/axern?sslmode=disable' \
                -principal-name local-admin \
                -display-name 'Local Administrator' \
                -credential-label local-client \
                -certificate /certs/client.crt \
                -ssh-public-key /certs/gateway_client_ed25519.pub \
                -node-id "node-k8s-local" \
                -enrollment-token-file /run/secrets/enrollment-token
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: enrollment-token
              mountPath: /run/secrets/enrollment-token
              subPath: enrollment-token
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: controld-pki
        - name: enrollment-token
          secret:
            secretName: enrollment-token
