apiVersion: batch/v1
kind: Job
metadata:
  name: controld-migrate
  namespace: axern-local
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: controld-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: controld-migrate
          image: axern/local-controld:dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              /usr/local/bin/controld-migrate -postgres-dsn 'postgres://postgres:postgres@postgres:5432/axern?sslmode=disable' up
              /usr/local/bin/controld-access-bootstrap \
                -postgres-dsn 'postgres://postgres:postgres@postgres:5432/axern?sslmode=disable' \
                -principal-name local-admin \
                -display-name 'Local Administrator' \
                -credential-label local-client \
                -certificate /certs/client.crt \
                -node-id "node-${NODE_NAME}" \
                -node-credential-file /run/secrets/node-credential
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: node-credential
              mountPath: /run/secrets/node-credential
              subPath: node-credential
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: controld-pki
        - name: node-credential
          secret:
            secretName: node-credential
