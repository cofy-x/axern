apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-all-in-one
  namespace: axern-local
spec:
  selector:
    matchLabels:
      app: node-all-in-one
  template:
    metadata:
      labels:
        app: node-all-in-one
    spec:
      # The local bootstrap replaces this exact-host constraint before apply.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values: ["local-bootstrap-must-select-node"]
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: node
          image: axern/local-node-all-in-one:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          envFrom:
            - configMapRef:
                name: local-proxy-env
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AXNODED_SOCKET
              value: /shared/run/axnoded.sock
            - name: AXNODED_NETWORK_SOCKET
              value: /shared/run/axnoded-network.sock
            - name: IMAGEMGR_SOCKET
              value: /run/imagemgr/imagemgr.sock
            - name: EGRESSD_SOCKET
              value: /run/egressd/egressd.sock
            - name: AXERN_SANDBOXD_BINARY
              value: /usr/local/libexec/axnoded/axern-sandboxd
            - name: AXNODED_GRPC_ADDRESS
              value: 0.0.0.0:24010
            - name: AXNODED_HTTP_ADDRESS
              value: 0.0.0.0:23001
            - name: AXNODED_CONTROL_PLANE_TARGET
              value: controld.axern-local.svc.cluster.local:24000
            - name: AXNODED_CONTROL_PLANE_HEARTBEAT_INTERVAL
              value: 1s
            - name: AXERN_WORKLOAD_CLUSTER
              value: axern.local
            - name: AXNODED_CONTROL_PLANE_ENROLLMENT_TARGET
              value: controld:24002
            - name: AXNODED_CONTROL_PLANE_TLS_CA_CERT
              value: /certs/ca.crt
            - name: AXNODED_CONTROL_PLANE_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: enrollment-token
                  key: enrollment-token
            # Match the verification runtime's local-only 1 GiB reserve:
            # a 512 MiB conformance charge must coexist with node daemons.
            # Production deployments must use a measured qualification receipt.
            - name: AXNODED_MEMORY_SYSTEM_RESERVE_BYTES
              value: "1073741824"
          command:
            - /bin/bash
            - -lc
            - |
              export AXNODED_CONTROL_PLANE_NODE_ID="node-${NODE_NAME}"
              export AXNODED_CONTROL_PLANE_NODE_TARGET="${POD_IP}:24010"
              exec /usr/local/bin/node-all-in-one-entrypoint
          ports:
            - containerPort: 24010
            - containerPort: 23001
          readinessProbe:
            httpGet:
              path: /readyz
              port: 23001
            initialDelaySeconds: 4
            periodSeconds: 3
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: shared-run
              mountPath: /shared/run
            - name: axnoded-state
              mountPath: /var/lib/axnoded
            - name: imagemgr-state
              mountPath: /var/lib/imagemgr
            - name: egressd-state
              mountPath: /var/lib/egressd
      volumes:
        - name: certs
          secret:
            secretName: controld-pki
            defaultMode: 384
            items:
              - key: ca.crt
                path: ca.crt
        - name: shared-run
          emptyDir: {}
        - name: axnoded-state
          hostPath:
            path: /var/lib/axern/node/axnoded
            type: DirectoryOrCreate
        - name: imagemgr-state
          hostPath:
            path: /var/lib/axern/node/imagemgr
            type: DirectoryOrCreate
        - name: egressd-state
          hostPath:
            path: /var/lib/axern/node/egressd
            type: DirectoryOrCreate
