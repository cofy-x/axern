apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunneld
  namespace: axern-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunneld
  template:
    metadata:
      labels:
        app: tunneld
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: tunneld
          image: axern/local-tunneld:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen
            - 0.0.0.0:24100
            - -control-target
            - controld.axern-local.svc.cluster.local:24000
            - -tls-ca-cert
            - /certs/ca.crt
            - -workload-bundle
            - /certs/tunneld.pem
            - -relay-id
            - default
            - -relay-tls-cert
            - /certs/tunneld.pem
            - -relay-tls-key
            - /certs/tunneld.pem
          ports:
            - containerPort: 24100
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: controld-pki
            defaultMode: 288
            items:
              - key: ca.crt
                path: ca.crt
              - key: tunneld.pem
                path: tunneld.pem
---
apiVersion: v1
kind: Service
metadata:
  name: tunneld
  namespace: axern-local
spec:
  selector:
    app: tunneld
  ports:
    - name: grpc
      port: 24100
      targetPort: 24100
