apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: axern-local
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
      otlp/lgtm:
        endpoint: otel-lgtm:4317
        tls:
          insecure: true
    processors:
      batch: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp/lgtm]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp/lgtm]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp/lgtm]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: axern-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.150.1
          args:
            - --config=/etc/otel/collector.yaml
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: axern-local
spec:
  type: NodePort
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
      nodePort: 30317
    - name: http
      port: 4318
      targetPort: 4318
      nodePort: 30318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: axern-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.11.16
          ports:
            - containerPort: 3000
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: grafana-dashboard-provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/axern.yaml
              subPath: axern.yaml
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards/axern
              readOnly: true
      volumes:
        - name: grafana-dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: axern-local
spec:
  type: NodePort
  selector:
    app: otel-lgtm
  ports:
    - name: ui
      port: 3000
      targetPort: 3000
      nodePort: 30301
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
