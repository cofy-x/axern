receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed
  otlp/lgtm:
    endpoint: otel-lgtm:4317
    tls:
      insecure: true

processors:
  batch: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm]
