syntax = "proto3";

package axern.node.sandbox.v1;

import "axern/common/file/v1/file.proto";
import "axern/control/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cofy-x/axern/sdk/go/gen/axern/node/sandbox/v1;nodesandboxv1";

// Execution

message ExecSpec {
  repeated string argv = 1;
  map<string, string> env = 2;
  string cwd = 3;
  int64 timeout_seconds = 4;
  bool tty = 5;
  string user = 6;
}

message ExecRequest {
  ExecSpec spec = 1;
  string allocation_id = 2;
}

message ExecResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  bool stdout_truncated = 4;
  bool stderr_truncated = 5;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ExecExit {
  int32 exit_code = 1;
  string message = 2;
}

message ProcessOpen {
  ExecSpec spec = 1;
  string allocation_id = 2;
  TerminalResize initial_size = 3;
}

message ProcessSignal {
  string signal = 1;
}

message ProcessReady {}

message ProcessRequest {
  oneof payload {
    ProcessOpen open = 1;
    bytes stdin = 2;
    TerminalResize resize = 3;
    bool close_stdin = 4;
    ProcessSignal signal = 5;
  }
}

message ProcessResponse {
  oneof payload {
    bytes stdout = 1;
    bytes stderr = 2;
    ExecExit exit = 3;
    ProcessReady ready = 4;
  }
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

message ReadOutputRequest {
  string allocation_id = 1;
  string cursor = 2;
  bool follow = 3;
}

message ReadOutputResponse {
  OutputStream stream = 1;
  bytes data = 2;
  string next_cursor = 3;
  bool terminal = 4;
  bool truncated = 5;
  int64 observed_at_unix_milli = 6;
}

enum SealedOutputStatus {
  SEALED_OUTPUT_STATUS_UNSPECIFIED = 0;
  SEALED_OUTPUT_STATUS_AVAILABLE = 1;
  SEALED_OUTPUT_STATUS_MISSING = 2;
  SEALED_OUTPUT_STATUS_REJECTED = 3;
  SEALED_OUTPUT_STATUS_CAPTURE_FAILED = 4;
  SEALED_OUTPUT_STATUS_NODE_UNAVAILABLE = 5;
}

message SealedOutput {
  string output_id = 1;
  string path = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
  string media_type = 5;
  axern.control.common.v1.DeclaredOutputFormat format = 6;
  SealedOutputStatus status = 7;
  string reason = 8;
  google.protobuf.Timestamp sealed_at = 9;
  google.protobuf.Timestamp expires_at = 10;
}

message GetSealedOutputManifestRequest {
  string allocation_id = 1;
}

message GetSealedOutputManifestResponse {
  repeated SealedOutput outputs = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message DownloadSealedOutputRequest {
  string allocation_id = 1;
  string output_id = 2;
  int64 offset = 3;
}

message DownloadSealedOutputResponse {
  bytes data = 1;
  int64 next_offset = 2;
  bool eof = 3;
}

// Capabilities

message CapabilityStatusRequest {
  string allocation_id = 1;
}

message CapabilityProviderDependencyStatus {
  string name = 1;
  bool available = 2;
  string reason = 3;
}

message CapabilityProviderStatus {
  string name = 1;
  string state = 2;
  bool available = 3;
  repeated string capabilities = 4;
  string backend = 5;
  string reason = 6;
  repeated CapabilityProviderDependencyStatus dependencies = 7;
}

message CapabilityProviderSummary {
  int32 total = 1;
  int32 available = 2;
  int32 degraded = 3;
  int32 unavailable = 4;
}

message CapabilityStatusResponse {
  bool ready = 1;
  repeated string capabilities = 2;
  repeated CapabilityProviderStatus providers = 3;
  CapabilityProviderSummary provider_summary = 4;
}

// Files

message StatFileRequest {
  string allocation_id = 1;
  string path = 2;
}

message StatFileResponse {
  axern.common.file.v1.SandboxFileInfo info = 1;
}

message ListDirRequest {
  string allocation_id = 1;
  string path = 2;
}

message ListDirResponse {
  repeated axern.common.file.v1.SandboxFileInfo entries = 1;
}

message ReadFileRequest {
  string allocation_id = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes data = 1;
}

message WriteFileRequest {
  string allocation_id = 1;
  string path = 2;
  bytes data = 3;
  bool create_parents = 4;
}

message WriteFileResponse {}

message MkdirRequest {
  string allocation_id = 1;
  string path = 2;
  bool parents = 3;
}

message MkdirResponse {}

message RemoveRequest {
  string allocation_id = 1;
  string path = 2;
  bool recursive = 3;
  bool force = 4;
}

message RemoveResponse {}

message ExistsRequest {
  string allocation_id = 1;
  string path = 2;
}

message ExistsResponse {
  bool exists = 1;
}

message CopyRequest {
  string allocation_id = 1;
  string src_path = 2;
  string dst_path = 3;
  bool recursive = 4;
  bool overwrite = 5;
}

message CopyResponse {}

message MoveRequest {
  string allocation_id = 1;
  string src_path = 2;
  string dst_path = 3;
  bool overwrite = 4;
}

message MoveResponse {}

message ChmodRequest {
  string allocation_id = 1;
  string path = 2;
  uint32 mode = 3;
  bool recursive = 4;
}

message ChmodResponse {}

message TouchRequest {
  string allocation_id = 1;
  string path = 2;
  bool create = 3;
  int64 mtime_ns = 4;
}

message TouchResponse {}

message UploadArchiveOpen {
  string allocation_id = 1;
  string path = 2;
  axern.common.file.v1.SandboxArchiveFormat format = 3;
  bool create_parents = 4;
  bool overwrite = 5;
  axern.common.file.v1.SandboxArchiveSymlinkPolicy symlink_policy = 6;
}

message UploadArchiveRequest {
  oneof payload {
    UploadArchiveOpen open = 1;
    bytes chunk = 2;
  }
}

message UploadArchiveResponse {}

message DownloadArchiveRequest {
  string allocation_id = 1;
  string path = 2;
  axern.common.file.v1.SandboxArchiveFormat format = 3;
  axern.common.file.v1.SandboxArchiveSymlinkPolicy symlink_policy = 4;
}

message DownloadArchiveResponse {
  bytes chunk = 1;
}

// Computer use

message ComputerUseStatusRequest {
  string allocation_id = 1;
}

message ComputerUseStatusResponse {
  bool available = 1;
  string display = 2;
  string backend = 3;
  string reason = 4;
  repeated ComputerUseDependencyStatus dependencies = 5;
}

message ComputerUseDependencyStatus {
  string name = 1;
  bool available = 2;
  string reason = 3;
}

message ComputerUseRegion {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message ComputerUseScreenshotRequest {
  string allocation_id = 1;
  bool show_cursor = 2;
  ComputerUseRegion region = 3;
  string format = 4;
  int32 quality = 5;
  double scale = 6;
}

message ComputerUseScreenshotResponse {
  bytes data = 1;
  string content_type = 2;
}

message ComputerUseDisplayRequest {
  string allocation_id = 1;
}

message ComputerUseDisplayResponse {
  string display = 1;
  string backend = 2;
  int32 width = 3;
  int32 height = 4;
}

message ComputerUseMouseRequest {
  string allocation_id = 1;
  string action = 2;
  int32 x = 3;
  int32 y = 4;
  int32 to_x = 5;
  int32 to_y = 6;
  string button = 7;
  string direction = 8;
  int32 amount = 9;
}

message ComputerUseMouseResponse {}

message ComputerUseKeyboardRequest {
  string allocation_id = 1;
  string text = 2;
  string key = 3;
  repeated string keys = 4;
  int32 delay_ms = 5;
}

message ComputerUseKeyboardResponse {}

service NodeSandbox {
  rpc Exec(ExecRequest) returns (ExecResponse) {}
  rpc Process(stream ProcessRequest) returns (stream ProcessResponse) {}
  rpc ReadOutput(ReadOutputRequest) returns (stream ReadOutputResponse) {}
  rpc GetSealedOutputManifest(GetSealedOutputManifestRequest) returns (GetSealedOutputManifestResponse) {}
  rpc DownloadSealedOutput(DownloadSealedOutputRequest) returns (stream DownloadSealedOutputResponse) {}
  rpc CapabilityStatus(CapabilityStatusRequest) returns (CapabilityStatusResponse) {}
  rpc StatFile(StatFileRequest) returns (StatFileResponse) {}
  rpc ListDir(ListDirRequest) returns (ListDirResponse) {}
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse) {}
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse) {}
  rpc Mkdir(MkdirRequest) returns (MkdirResponse) {}
  rpc Remove(RemoveRequest) returns (RemoveResponse) {}
  rpc Exists(ExistsRequest) returns (ExistsResponse) {}
  rpc Copy(CopyRequest) returns (CopyResponse) {}
  rpc Move(MoveRequest) returns (MoveResponse) {}
  rpc Chmod(ChmodRequest) returns (ChmodResponse) {}
  rpc Touch(TouchRequest) returns (TouchResponse) {}
  rpc UploadArchive(stream UploadArchiveRequest) returns (UploadArchiveResponse) {}
  rpc DownloadArchive(DownloadArchiveRequest) returns (stream DownloadArchiveResponse) {}
  rpc ComputerUseStatus(ComputerUseStatusRequest) returns (ComputerUseStatusResponse) {}
  rpc ComputerUseScreenshot(ComputerUseScreenshotRequest) returns (ComputerUseScreenshotResponse) {}
  rpc ComputerUseDisplay(ComputerUseDisplayRequest) returns (ComputerUseDisplayResponse) {}
  rpc ComputerUseMouse(ComputerUseMouseRequest) returns (ComputerUseMouseResponse) {}
  rpc ComputerUseKeyboard(ComputerUseKeyboardRequest) returns (ComputerUseKeyboardResponse) {}
}
