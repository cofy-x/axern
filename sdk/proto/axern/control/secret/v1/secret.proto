syntax = "proto3";

package axern.control.secret.v1;

option go_package = "github.com/cofy-x/axern/sdk/go/gen/axern/control/secret/v1;secretv1";

import "google/protobuf/timestamp.proto";

enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_OPAQUE = 1;
  SECRET_TYPE_DOCKER_CONFIG_JSON = 2;
}

message Secret {
  string id = 1;
  string namespace = 2;
  SecretType type = 3;
  repeated string data_keys = 4;
  map<string, string> labels = 5;
  int64 version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SecretListFilter {
  string namespace = 1;
  SecretType type = 2;
  map<string, string> labels = 3;
  string cursor = 4;
  int32 page_size = 5;
}

message CreateSecretRequest {
  string namespace = 1;
  SecretType type = 2;
  // The JSON-encoded map must not exceed 64 KiB. Values are preserved verbatim.
  map<string, string> string_data = 3;
  map<string, string> labels = 4;
}

message CreateSecretResponse {
  Secret secret = 1;
}

message GetSecretRequest {
  string secret_id = 1;
}

message GetSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {
  SecretListFilter filter = 1;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
  string next_cursor = 2;
}

message DeleteSecretRequest {
  string secret_id = 1;
}

message DeleteSecretResponse {
  Secret secret = 1;
}

service SecretControl {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse) {}
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {}
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {}
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {}
}
