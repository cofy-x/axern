syntax = "proto3";

package axern.control.catalog.v1;

option go_package = "github.com/cofy-x/axern/sdk/go/gen/axern/control/catalog/v1;catalogv1";

message EnvironmentMount {
  string type = 1;
  string source = 2;
  string target = 3;
  repeated string options = 4;
}

message EnvironmentTemplateCapabilities {
  bool supports_exec = 1;
  bool supports_exec_stream = 2;
  bool supports_long_lived_process = 3;
  bool supports_ports = 4;
  bool supports_computer_use = 5;
}

message OciImageDescriptor {
  string digest = 1;
  string media_type = 2;
  int64 size_bytes = 3;
  map<string, string> annotations = 4;
}

message OciBaselinePolicy {
  repeated string capabilities = 1;
  uint64 no_file_limit = 2;
}

message OciCapabilityPolicy {
  string annotation_key = 1;
  optional bool include_ambient = 2;
}

message OciNetworkNamespacePolicy {
  string annotation_key = 1;
}

message OciResourcePolicy {
  repeated string ignore_annotation_keys = 1;
}

message OciExecutionProfile {
  OciBaselinePolicy baseline = 1;
  OciCapabilityPolicy capabilities = 2;
  OciNetworkNamespacePolicy network_namespace = 3;
  OciResourcePolicy resources = 4;
}

message EnvironmentTemplate {
  string id = 1;
  bool rootfs_readonly = 2;
  // Informational image default command, usually OCI Entrypoint + Cmd for
  // built-in templates. Workloads with no explicit argv preserve the image
  // default at node runtime instead of using this field as a control-plane
  // bootstrap override.
  repeated string image_default_argv = 3;
  string default_cwd = 4;
  map<string, string> default_env = 5;
  repeated EnvironmentMount mounts = 6;
  EnvironmentTemplateCapabilities capabilities = 7;
  string language = 8;
  string language_version = 9;
  string description = 10;
  string version = 11;
  OciImageDescriptor image_descriptor = 12;
  string warm_policy = 13;
  string cache_policy = 14;
  OciExecutionProfile execution_profile = 15;
}

message ListEnvironmentTemplatesRequest {
  string namespace = 1;
  string version = 2;
  string language = 3;
}

message ListEnvironmentTemplatesResponse {
  repeated EnvironmentTemplate environment_templates = 1;
}

message GetEnvironmentTemplateRequest {
  string id = 1;
  string version = 2;
}

message GetEnvironmentTemplateResponse {
  EnvironmentTemplate environment_template = 1;
}

service EnvironmentCatalog {
  rpc ListEnvironmentTemplates(ListEnvironmentTemplatesRequest) returns (ListEnvironmentTemplatesResponse) {}
  rpc GetEnvironmentTemplate(GetEnvironmentTemplateRequest) returns (GetEnvironmentTemplateResponse) {}
}
