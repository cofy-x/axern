syntax = "proto3";

package axern.control.run.v1;

option go_package = "github.com/cofy-x/axern/sdk/go/gen/axern/control/run/v1;runv1";

import "axern/control/common/v1/common.proto";
import "axern/control/capability/v1/capability.proto";
import "axern/control/environment/v1/environment.proto";
import "google/protobuf/timestamp.proto";

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PLACED = 1;
  RUN_STATUS_STARTING = 2;
  RUN_STATUS_RUNNING = 3;
  RUN_STATUS_SUCCEEDED = 4;
  RUN_STATUS_FAILED = 5;
  RUN_STATUS_CANCELLED = 6;
}

enum RootfsSnapshotStatus {
  ROOTFS_SNAPSHOT_STATUS_UNSPECIFIED = 0;
  ROOTFS_SNAPSHOT_STATUS_PENDING = 1;
  ROOTFS_SNAPSHOT_STATUS_READY = 2;
  ROOTFS_SNAPSHOT_STATUS_FAILED = 3;
}

// RootfsSnapshotResult is the finalization result for a requested rootfs
// snapshot. The Environment is the durable public identity; the OCI fields
// are immutable integrity and platform metadata, not caller credentials.
message RootfsSnapshotResult {
  RootfsSnapshotStatus status = 1;
  string environment_id = 2;
  string image_ref = 3;
  axern.control.environment.v1.OciImageDescriptor image_descriptor = 4;
  string platform_os = 5;
  string platform_arch = 6;
  string platform_variant = 7;
  string message = 8;
}

message Run {
  string id = 1;
  string namespace = 2;
  string environment_id = 3;
  string allocation_id = 4;
  RunStatus status = 5;
  axern.control.common.v1.ExecutionConfig config = 6;
  map<string, string> labels = 7;
  int64 version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional int32 exit_code = 11;
  string message = 12;
  axern.control.common.v1.WorkloadDiagnosticCode diagnostic_code = 13;
  // Latest allocation capability condition projection. It is independent
  // from Run lifecycle status and message.
  axern.control.capability.v1.CapabilityConditionSet capability_conditions = 14;
  // Immutable Environment input frozen atomically with Run admission. The
  // source record may be deleted after this Run is created.
  axern.control.environment.v1.EnvironmentSpec environment_spec = 15;
  axern.control.environment.v1.ResolvedEnvironmentSpec resolved_environment_spec = 16;
  // Node-local stdout/stderr availability deadline; node loss may make bytes unavailable earlier.
  google.protobuf.Timestamp output_expires_at = 17;
  RootfsSnapshotResult rootfs_snapshot = 18;
}

message RunListFilter {
  string namespace = 1;
  repeated RunStatus statuses = 2;
  map<string, string> labels = 3;
  string cursor = 4;
  int32 page_size = 5;
}

message CreateRunRequest {
  string namespace = 1;
  string environment_id = 2;
  axern.control.common.v1.ExecutionConfig config = 3;
  map<string, string> labels = 4;
}

message CreateRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message WatchRunRequest {
  string run_id = 1;
  int64 after_version = 2;
}

message WatchRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  RunListFilter filter = 1;
}

message ListRunsResponse {
  repeated Run runs = 1;
  string next_cursor = 2;
}

message CancelRunRequest {
  string run_id = 1;
}

message CancelRunResponse {
  Run run = 1;
}

service RunControl {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse) {}
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {}
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse) {}
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {}
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse) {}
}
