syntax = "proto3";

package axern.control.run.v1;

option go_package = "github.com/cofy-x/axern/sdk/go/gen/axern/control/run/v1;runv1";

import "axern/control/common/v1/common.proto";
import "axern/control/capability/v1/capability.proto";
import "google/protobuf/timestamp.proto";

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PLACED = 1;
  RUN_STATUS_STARTING = 2;
  RUN_STATUS_RUNNING = 3;
  RUN_STATUS_SUCCEEDED = 4;
  RUN_STATUS_FAILED = 5;
  RUN_STATUS_CANCELLED = 6;
}

message Run {
  string id = 1;
  string namespace = 2;
  string environment_id = 3;
  string allocation_id = 4;
  RunStatus status = 5;
  axern.control.common.v1.ExecutionConfig config = 6;
  map<string, string> labels = 7;
  int64 version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  int32 exit_code = 11;
  bool exit_code_known = 12;
  string message = 13;
  axern.control.common.v1.WorkloadDiagnosticCode diagnostic_code = 14;
  // Full, monotonically revised allocation capability condition projection.
  // It is independent from Run lifecycle status and message.
  axern.control.capability.v1.CapabilityConditionSet capability_conditions = 15;
  string node_id = 16;
  axern.control.common.v1.WorkspacePreparationFacts workspace_preparation = 17;
}

message RunListFilter {
  string namespace = 1;
  repeated RunStatus statuses = 2;
  map<string, string> labels = 3;
  string cursor = 4;
  int32 page_size = 5;
}

message CreateRunRequest {
  string namespace = 1;
  string environment_id = 2;
  axern.control.common.v1.ExecutionConfig config = 3;
  map<string, string> labels = 4;
}

message CreateRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message WatchRunRequest {
  string run_id = 1;
  int64 after_version = 2;
}

message WatchRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  RunListFilter filter = 1;
}

message ListRunsResponse {
  repeated Run runs = 1;
  string next_cursor = 2;
}

message CancelRunRequest {
  string run_id = 1;
}

message CancelRunResponse {
  Run run = 1;
}

service RunControl {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse) {}
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {}
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse) {}
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {}
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse) {}
}
