syntax = "proto3";

package axern.private.rollout.artifact.v1;

option go_package = "github.com/cofy-x/axern/sdk/go/gen/axern/private/rollout/artifact/v1;rolloutartifactv1";

import "axern/control/rollout/v1/rollout.proto";
import "google/protobuf/timestamp.proto";

message ResolveDownloadTicketRequest {
  string ticket = 1;
  int64 offset = 2;
}

message ResolveDownloadTicketResponse {
  axern.control.rollout.v1.Artifact artifact = 1;
  string url = 2;
  map<string, string> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

service ArtifactAccess {
  rpc ResolveDownloadTicket(ResolveDownloadTicketRequest) returns (ResolveDownloadTicketResponse) {}
}
