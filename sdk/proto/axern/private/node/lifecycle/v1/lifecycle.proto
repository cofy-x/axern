syntax = "proto3";

package axern.private.node.lifecycle.v1;

option go_package = "github.com/cofy-x/axern/internal/proto/gen/axern/private/node/lifecycle/v1;nodelifecyclev1";

import "axern/control/common/v1/common.proto";
import "axern/control/environment/v1/environment.proto";
import "axern/control/capability/v1/capability.proto";

message SandboxMount {
  string type = 1;
  string source = 2;
  string target = 3;
  repeated string options = 4;
}

message ImageMount {
  string image = 1;
  string target = 2;
  bool readonly = 3;
}

message ResolvedSecretEnvVar {
  string name = 1;
  string value = 2;
}

message ResolvedSecretFile {
  string path = 1;
  bytes content = 2;
  uint32 mode = 3;
}

message RegistryCredential {
  string docker_config_json = 1;
}

service NodeLifecycle {
  rpc AdmitAllocation(CreateAllocationRequest) returns (CreateAllocationResponse) {}
  rpc DeleteAllocation(DeleteAllocationRequest) returns (DeleteAllocationResponse) {}
  rpc AcknowledgeAllocationRelease(AcknowledgeAllocationReleaseRequest) returns (AcknowledgeAllocationReleaseResponse) {}
  rpc GetAllocationLifecycle(GetAllocationLifecycleRequest) returns (GetAllocationLifecycleResponse) {}
  rpc ProvisionWorkspace(ProvisionWorkspaceRequest) returns (ProvisionWorkspaceResponse) {}
  rpc InspectWorkspace(InspectWorkspaceRequest) returns (InspectWorkspaceResponse) {}
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {}
}

message WorkspaceSpec {
  string workspace_id = 1;
  string namespace = 2;
  string node_id = 3;
  int64 capacity_bytes = 4;
  int64 inode_limit = 5;
  string storage_root_identity = 6;
}

message WorkspaceBinding {
  WorkspaceSpec spec = 1;
  string storage_identity = 2;
  int64 generation = 3;
  string target = 4;
}

message WorkspaceCleanupReceipt {
  string workspace_id = 1;
  string allocation_id = 2;
  int64 generation = 3;
  string storage_identity = 4;
}

message ProvisionWorkspaceRequest { WorkspaceSpec spec = 1; }
message ProvisionWorkspaceResponse {
  string storage_identity = 1;
  int64 used_bytes = 2;
  int64 used_inodes = 3;
}
message InspectWorkspaceRequest {
  WorkspaceSpec spec = 1;
  string storage_identity = 2;
}
message InspectWorkspaceResponse {
  int64 used_bytes = 1;
  int64 used_inodes = 2;
}
message DeleteWorkspaceRequest {
  WorkspaceSpec spec = 1;
  string storage_identity = 2;
}
message DeleteWorkspaceResponse {}

message ResolvedExecutionConfig {
  string environment_id = 1;
  string image_digest = 2;
  string image_descriptor = 3;
  repeated string argv = 4;
  string cwd = 5;
  map<string, string> env = 6;
  repeated SandboxMount mounts = 7;
  axern.control.common.v1.ResourceSpec resources = 8;
  repeated axern.control.capability.v1.ExtensionCapabilityRequirement extension_capability_requirements = 9;
  string locality_key = 10;
  bool rootfs_readonly = 11;
  axern.control.common.v1.NetworkSpec network = 12;
  string local_rootfs_path = 13;
  string stdout_path = 14;
  string stderr_path = 15;
  repeated ResolvedSecretEnvVar secret_env = 16;
  repeated ResolvedSecretFile secret_files = 17;
  RegistryCredential registry_credential = 18;
  axern.control.environment.v1.OciExecutionProfile execution_profile = 19;
  repeated ImageMount image_mounts = 20;
  repeated axern.control.capability.v1.CapabilityRequirement capability_requirements = 21;
  repeated axern.control.common.v1.DeclaredOutput declared_outputs = 22;
  axern.control.common.v1.RootfsSnapshot rootfs_snapshot = 23;
  WorkspaceBinding workspace = 24;
}

message CreateAllocationRequest {
  string allocation_id = 1;
  string node_id = 2;
  ResolvedExecutionConfig config = 3;
  int64 execution_lease_ttl_seconds = 4;
}

message CreateAllocationResponse {
  string allocation_id = 1;
  axern.control.capability.v1.CapabilityConditionSet capability_verification = 2;
}

message OutputSealingRequest {
  int64 expires_at_unix_nano = 1;
  repeated axern.control.common.v1.DeclaredOutput outputs = 2;
}

// RootfsSnapshotSealingRequest is the transient final-cleanup command derived
// from the immutable Run specification. Registry credentials are used only to
// read the original private base image and are never persisted by axnoded.
message RootfsSnapshotSealingRequest {
  string base_image_ref = 1;
  RegistryCredential base_registry_credential = 2;
}

message RootfsSnapshotSealingResult {
  string image_ref = 1;
  axern.control.environment.v1.OciImageDescriptor image_descriptor = 2;
  string platform_os = 3;
  string platform_arch = 4;
  string platform_variant = 5;
}

message DeleteAllocationRequest {
  string allocation_id = 1;
  string node_id = 2;
  int64 timeout_seconds = 3;
  OutputSealingRequest output_sealing = 4;
  RootfsSnapshotSealingRequest rootfs_snapshot_sealing = 5;
  WorkspaceBinding workspace = 6;
}

message DeleteAllocationResponse {
  RootfsSnapshotSealingResult rootfs_snapshot = 1;
  WorkspaceCleanupReceipt workspace_cleanup = 2;
}

message AcknowledgeAllocationReleaseRequest {
  string allocation_id = 1;
  string node_id = 2;
  WorkspaceCleanupReceipt workspace_cleanup = 3;
}

message AcknowledgeAllocationReleaseResponse {}

message GetAllocationLifecycleRequest {
  string allocation_id = 1;
  string node_id = 2;
}

message GetAllocationLifecycleResponse {
  axern.control.common.v1.AllocationLifecycleState state = 1;
  optional int32 exit_code = 2;
  string message = 3;
  axern.control.capability.v1.CapabilityConditionSet capability_verification = 4;
  axern.control.common.v1.WorkloadDiagnosticCode diagnostic_code = 5;
}
