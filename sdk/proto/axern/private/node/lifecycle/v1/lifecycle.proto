syntax = "proto3";

package axern.private.node.lifecycle.v1;

option go_package = "github.com/cofy-x/axern/sdk/go/gen/axern/private/node/lifecycle/v1;nodelifecyclev1";

import "axern/control/common/v1/common.proto";
import "axern/control/catalog/v1/catalog.proto";
import "axern/control/capability/v1/capability.proto";

message SandboxMount {
  string type = 1;
  string source = 2;
  string target = 3;
  repeated string options = 4;
}

message ImageMount {
  string image = 1;
  string target = 2;
  bool readonly = 3;
}

message WorkspaceImageVariant {
  string format = 1;
  string image = 2;
}

message WorkspaceImageSource {
  repeated WorkspaceImageVariant variants = 1;
  string source_path = 2;
  string target = 3;
}

message ResolvedSecretEnvVar {
  string name = 1;
  string value = 2;
}

message ResolvedSecretFile {
  string path = 1;
  bytes content = 2;
  uint32 mode = 3;
}

message RegistryCredential {
  string docker_config_json = 1;
}

service NodeLifecycle {
  rpc CreateAllocation(CreateAllocationRequest) returns (CreateAllocationResponse) {}
  rpc DeleteAllocation(DeleteAllocationRequest) returns (DeleteAllocationResponse) {}
  rpc GetAllocationStatus(GetAllocationStatusRequest) returns (GetAllocationStatusResponse) {}
}

message ResolvedExecutionConfig {
  string environment_id = 1;
  string image_digest = 2;
  string image_descriptor = 3;
  string runtime_class = 4;
  repeated string argv = 5;
  string cwd = 6;
  map<string, string> env = 7;
  repeated SandboxMount mounts = 8;
  axern.control.common.v1.ResourceSpec resources = 9;
  repeated axern.control.capability.v1.ExtensionCapabilityRequirement extension_capability_requirements = 10;
  string locality_key = 11;
  bool rootfs_readonly = 12;
  repeated axern.control.common.v1.PortSpec ports = 13;
  axern.control.common.v1.NetworkSpec network = 14;
  string local_rootfs_path = 15;
  string stdout_path = 16;
  string stderr_path = 17;
  repeated string linux_capabilities = 18;
  repeated ResolvedSecretEnvVar secret_env = 19;
  repeated ResolvedSecretFile secret_files = 20;
  RegistryCredential registry_credential = 21;
  axern.control.catalog.v1.RuntimeExecutionProfile execution_profile = 22;
  repeated ImageMount image_mounts = 23;
  WorkspaceImageSource workspace_image = 24;
  repeated axern.control.capability.v1.CapabilityDependency capability_dependencies = 25;
}

message CreateAllocationRequest {
  string allocation_id = 1;
  int64 attempt = 2;
  string node_id = 3;
  ResolvedExecutionConfig config = 4;
}

message CreateAllocationResponse {
  string allocation_id = 1;
  int64 attempt = 2;
  axern.control.common.v1.WorkspacePreparationFacts workspace_preparation = 3;
  axern.control.capability.v1.CapabilityConditionSet capability_verification = 4;
  // The concrete dependency/evidence set admitted by axnoded after the
  // runtime-specific post-create verification. This is authoritative; callers
  // must not reconstruct admitted evidence from conditions.
  repeated axern.control.capability.v1.CapabilityDependency admitted_capability_dependencies = 5;
}

message DeleteAllocationRequest {
  string allocation_id = 1;
  int64 attempt = 2;
  string node_id = 3;
  int64 timeout_seconds = 4;
}

message DeleteAllocationResponse {}

message GetAllocationStatusRequest {
  string allocation_id = 1;
  int64 attempt = 2;
  string node_id = 3;
}

message GetAllocationStatusResponse {
  axern.control.common.v1.AllocationStatus status = 1;
  int32 exit_code = 2;
  bool exit_code_known = 3;
  string message = 4;
  axern.control.capability.v1.CapabilityConditionSet capability_verification = 5;
  repeated axern.control.capability.v1.CapabilityDependency admitted_capability_dependencies = 6;
}
