syntax = "proto3";

package axern.private.node.operator.v1;

option go_package = "github.com/cofy-x/axern/internal/proto/gen/axern/private/node/operator/v1;nodeoperatorv1";

import "axern/private/control/node/v1/node_control.proto";
import "axern/node/sandbox/v1/node.proto";
import "google/protobuf/timestamp.proto";

enum LocalAllocationState {
  LOCAL_ALLOCATION_STATE_UNSPECIFIED = 0;
  LOCAL_ALLOCATION_STATE_RUNNING = 1;
  LOCAL_ALLOCATION_STATE_EXITED = 2;
  LOCAL_ALLOCATION_STATE_UNKNOWN = 3;
}

enum AllocationNetworkPolicyMode {
  ALLOCATION_NETWORK_POLICY_MODE_UNSPECIFIED = 0;
  ALLOCATION_NETWORK_POLICY_MODE_UNRESTRICTED = 1;
  ALLOCATION_NETWORK_POLICY_MODE_DNS_DENY = 2;
  ALLOCATION_NETWORK_POLICY_MODE_STRICT = 3;
}

enum AllocationNetworkPolicyStatus {
  ALLOCATION_NETWORK_POLICY_STATUS_UNSPECIFIED = 0;
  ALLOCATION_NETWORK_POLICY_STATUS_OK = 1;
  ALLOCATION_NETWORK_POLICY_STATUS_ABSENT = 2;
  ALLOCATION_NETWORK_POLICY_STATUS_CAPABILITY_UNAVAILABLE = 3;
  ALLOCATION_NETWORK_POLICY_STATUS_ENFORCEMENT_UNHEALTHY = 4;
  ALLOCATION_NETWORK_POLICY_STATUS_BINDING_MISMATCH = 5;
}

enum AllocationNetworkPolicyCapabilityState {
  ALLOCATION_NETWORK_POLICY_CAPABILITY_STATE_UNSPECIFIED = 0;
  ALLOCATION_NETWORK_POLICY_CAPABILITY_STATE_AVAILABLE = 1;
  ALLOCATION_NETWORK_POLICY_CAPABILITY_STATE_UNAVAILABLE = 2;
  ALLOCATION_NETWORK_POLICY_CAPABILITY_STATE_UNKNOWN = 3;
  ALLOCATION_NETWORK_POLICY_CAPABILITY_STATE_NOT_REQUIRED = 4;
}

message LocalAllocation {
  string allocation_id = 1;
  LocalAllocationState state = 2;
  optional int32 exit_code = 3;
  string message = 4;
  int32 pid = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
}

message ListAllocationsRequest {}

message ListAllocationsResponse {
  repeated LocalAllocation allocations = 1;
}

message GetAllocationRequest {
  string allocation_id = 1;
}

message GetAllocationResponse {
  LocalAllocation allocation = 1;
}

message SandboxdProviderDependency {
  string name = 1;
  bool available = 2;
  string reason = 3;
}

message SandboxdProvider {
  string name = 1;
  string state = 2;
  bool available = 3;
  repeated string capabilities = 4;
  string backend = 5;
  string command = 6;
  string reason = 7;
  string last_error = 8;
  repeated SandboxdProviderDependency dependencies = 9;
}

message SandboxdProviderSummary {
  int32 total = 1;
  int32 available = 2;
  int32 degraded = 3;
  int32 unavailable = 4;
}

message SandboxdProcessSummary {
  int32 total = 1;
  int32 starting = 2;
  int32 running = 3;
  int32 exited = 4;
  int32 failed = 5;
}

message GetAllocationDiagnosticsRequest {
  string allocation_id = 1;
  bool full = 2;
}

message GetAllocationDiagnosticsResponse {
  string allocation_id = 1;
  bool ready = 2;
  string detail = 3;
  google.protobuf.Timestamp generated_at = 4;
  int32 daemon_pid = 5;
  double uptime_seconds = 6;
  string socket_path = 7;
  string user_state = 8;
  repeated string capabilities = 9;
  repeated SandboxdProvider providers = 10;
  SandboxdProviderSummary provider_summary = 11;
  SandboxdProcessSummary process_summary = 12;
  string raw_json = 13;
  axern.private.control.node.v1.AllocationMemoryObservation memory = 14;
}

message GetAllocationMemoryRequest {
  string allocation_id = 1;
}

message GetAllocationMemoryResponse {
  axern.private.control.node.v1.AllocationMemoryObservation observation = 1;
}

message ExplainAllocationNetworkPolicyRequest {
  string allocation_id = 1;
}

message ExplainAllocationNetworkPolicyResponse {
  string allocation_id = 1;
  AllocationNetworkPolicyMode mode = 2;
  AllocationNetworkPolicyStatus status = 3;
  AllocationNetworkPolicyCapabilityState capability_state = 4;
  bool enforcement_healthy = 5;
  bool exact_binding = 6;
  int64 enforcement_revision = 7;
  uint32 domain_rule_count = 8;
  uint32 cidr_rule_count = 9;
  uint32 port_range_count = 10;
  uint32 total_rule_count = 11;
}

message ForceTerminateAllocationRequest {
  string allocation_id = 1;
  string reason = 2;
}

message ForceTerminateAllocationResponse {}

message ForceCleanupAllocationRequest {
  string allocation_id = 1;
  string reason = 2;
  int64 timeout_seconds = 3;
}

message ForceCleanupAllocationResponse {}

message ExecRequest {
  string allocation_id = 1;
  axern.node.sandbox.v1.ExecSpec spec = 2;
}

message ExecResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  bool stdout_truncated = 4;
  bool stderr_truncated = 5;
}

message ExecStreamOpen {
  string allocation_id = 1;
  axern.node.sandbox.v1.ExecSpec spec = 2;
  TerminalResize initial_size = 3;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ExecStreamRequest {
  oneof payload {
    ExecStreamOpen open = 1;
    bytes stdin = 2;
    TerminalResize resize = 3;
    bool close_stdin = 4;
  }
}

message ExecExit {
  int32 exit_code = 1;
  string message = 2;
}

message ExecStreamResponse {
  oneof payload {
    bytes stdout = 1;
    bytes stderr = 2;
    ExecExit exit = 3;
  }
}

message WaitRequest {
  string allocation_id = 1;
}

message WaitResponse {
  LocalAllocationState state = 1;
  optional int32 exit_code = 2;
  string message = 3;
}

service NodeOperator {
  rpc ListAllocations(ListAllocationsRequest) returns (ListAllocationsResponse) {}
  rpc GetAllocation(GetAllocationRequest) returns (GetAllocationResponse) {}
  rpc GetAllocationDiagnostics(GetAllocationDiagnosticsRequest) returns (GetAllocationDiagnosticsResponse) {}
  rpc GetAllocationMemory(GetAllocationMemoryRequest) returns (GetAllocationMemoryResponse) {}
  rpc ExplainAllocationNetworkPolicy(ExplainAllocationNetworkPolicyRequest) returns (ExplainAllocationNetworkPolicyResponse) {}
  rpc ForceTerminateAllocation(ForceTerminateAllocationRequest) returns (ForceTerminateAllocationResponse) {}
  rpc ForceCleanupAllocation(ForceCleanupAllocationRequest) returns (ForceCleanupAllocationResponse) {}
  rpc Exec(ExecRequest) returns (ExecResponse) {}
  rpc ExecStream(stream ExecStreamRequest) returns (stream ExecStreamResponse) {}
  rpc Wait(WaitRequest) returns (WaitResponse) {}
}
