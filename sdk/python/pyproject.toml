[project]
name = "axern-sdk"
version = "0.3.1"
description = "Python SDK for Axern agentic infrastructure and isolated sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "grpcio>=1.81.0",
    "protobuf>=6.31.1",
    "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://axern.cofy-x.space/sdk/python/"
Documentation = "https://axern.cofy-x.space/sdk/python/"
Repository = "https://github.com/cofy-x/axern"
Issues = "https://github.com/cofy-x/axern/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axern_sdk", "src/axern"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.12",
]
