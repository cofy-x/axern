[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
priority=1
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24 -nolisten tcp
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.out.log
stderr_logfile=/var/log/supervisor/xvfb.err.log

[program:fluxbox]
priority=2
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/fluxbox.out.log
stderr_logfile=/var/log/supervisor/fluxbox.err.log
