volumes:
  node-imagemgr-state:
  snapshot-registry-data:

services:
  registry:
    image: ${REGISTRY_IMAGE}
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes: ["snapshot-registry-data:/var/lib/registry"]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:5000/v2/"]
      interval: 1s
      timeout: 3s
      retries: 30

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: axern
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT}:5432"]
    volumes: ["${AXERN_LOCAL_DIR}/data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d axern"]
      interval: 3s
      timeout: 3s
      retries: 30

  controld-migrate:
    image: ${CONTROLD_IMAGE}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/usr/local/bin/controld-migrate"]
    command: ["-postgres-dsn", "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/axern?sslmode=disable", "up"]

  controld-access-bootstrap:
    image: ${CONTROLD_IMAGE}
    depends_on:
      controld-migrate: {condition: service_completed_successfully}
    restart: "no"
    entrypoint: ["/usr/local/bin/controld-access-bootstrap"]
    command:
      - -postgres-dsn
      - postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/axern?sslmode=disable
      - -principal-name
      - local-admin
      - -display-name
      - Local Administrator
      - -credential-label
      - local-client
      - -certificate
      - /certs/client.crt
      - -ssh-public-key
      - /ssh/gateway_client_ed25519.pub
      - -node-id
      - ${AXNODED_CONTROL_PLANE_NODE_ID:-node-local}
      - -enrollment-token-file
      - /run/secrets/enrollment-token
    volumes:
      - "${AXERN_LOCAL_DIR}/certs/client.crt:/certs/client.crt:ro"
      - "${AXERN_LOCAL_DIR}/ssh/gateway_client_ed25519.pub:/ssh/gateway_client_ed25519.pub:ro"
      - "${AXERN_LOCAL_DIR}/enrollment-token:/run/secrets/enrollment-token:ro"

  controld:
    image: ${CONTROLD_IMAGE}
    depends_on:
      controld-migrate: {condition: service_completed_successfully}
      controld-access-bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      CONTROLD_POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/axern?sslmode=disable
      AXERN_SECRETS_MASTER_KEY: ${AXERN_SECRETS_MASTER_KEY}
      CONTROLD_TLS_CA_CERT: /certs/ca.crt
      AXERN_WORKLOAD_CLUSTER: axern.local
      CONTROLD_WORKLOAD_BUNDLE: /certs/controld.pem
      CONTROLD_WORKLOAD_SIGNER_BUNDLE: /signer/signer.pem
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY}
      NO_PROXY: ${CONTAINER_NO_PROXY}
      http_proxy: ${CONTAINER_HTTP_PROXY}
      https_proxy: ${CONTAINER_HTTPS_PROXY}
      no_proxy: ${CONTAINER_NO_PROXY}
      CONTROLD_INSECURE_REGISTRIES: ${CONTROLD_INSECURE_REGISTRIES}
      AXERN_OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
    command:
      - -enrollment-address
      - 0.0.0.0:24002
      - -grpc-address
      - 0.0.0.0:24000
      - -http-address
      - 0.0.0.0:24001
      - -heartbeat-freshness-window
      - 15s
      - -summary-freshness-window
      - 15s
      - -postgres-dsn
      - postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/axern?sslmode=disable
      - -tls-ca-cert
      - /certs/ca.crt
      - -tunnel-relays
      - default,127.0.0.1:${GATEWAY_CONTROL_PORT},tunneld:24100,1,false
    ports: ["127.0.0.1:${CONTROLD_HTTP_PORT}:24001"]
    volumes: ["${AXERN_LOCAL_DIR}/certs/private/signer.pem:/signer/signer.pem:ro", "${AXERN_LOCAL_DIR}/certs/ca.crt:/certs/ca.crt:ro", "${AXERN_LOCAL_DIR}/certs/controld.pem:/certs/controld.pem:ro"]

  tunneld:
    image: ${TUNNELD_IMAGE}
    user: "${LOCAL_UID}:${LOCAL_GID}"
    depends_on: [controld]
    restart: unless-stopped
    command: ["-listen", "0.0.0.0:24100", "-control-target", "controld:24000", "-tls-ca-cert", "/certs/ca.crt", "-workload-bundle", "/certs/tunneld.pem", "-relay-id", "default", "-relay-tls-cert", "/certs/tunneld.pem", "-relay-tls-key", "/certs/tunneld.pem"]
    volumes: ["${AXERN_LOCAL_DIR}/certs/ca.crt:/certs/ca.crt:ro", "${AXERN_LOCAL_DIR}/certs/tunneld.pem:/certs/tunneld.pem:ro"]

  controld-retention:
    image: ${CONTROLD_IMAGE}
    depends_on:
      controld-migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/controld-retention"]
    environment:
      CONTROLD_POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/axern?sslmode=disable
      CONTROLD_RETENTION_ENABLED: "true"
      AXERN_OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
    command: ["-postgres-dsn", "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/axern?sslmode=disable"]

  node:
    image: ${NODE_ALL_IN_ONE_IMAGE}
    privileged: true
    restart: unless-stopped
    depends_on:
      controld: {condition: service_started}
      registry: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      AXNODED_SOCKET: /shared/run/axnoded.sock
      IMAGEMGR_SOCKET: /run/imagemgr/imagemgr.sock
      AXERN_SANDBOXD_BINARY: /usr/local/libexec/axnoded/axern-sandboxd
      AXNODED_GRPC_ADDRESS: 0.0.0.0:24010
      AXNODED_HTTP_ADDRESS: 0.0.0.0:23001
      AXNODED_CONTROL_PLANE_TARGET: controld:24000
      AXNODED_CONTROL_PLANE_NODE_ID: ${AXNODED_CONTROL_PLANE_NODE_ID:-node-local}
      AXNODED_CONTROL_PLANE_NODE_TARGET: node:24010
      AXNODED_ENROLLMENT_TOKEN_FILE: /bootstrap/enrollment-token
      AXNODED_CONTROL_PLANE_HEARTBEAT_INTERVAL: 1s
      AXNODED_CONTROL_PLANE_TLS_CA_CERT: /certs/ca.crt
      AXERN_WORKLOAD_CLUSTER: axern.local
      AXNODED_CONTROL_PLANE_ENROLLMENT_TARGET: controld:24002
      AXNODED_DNS_NAMESERVERS: ${AXNODED_DNS_NAMESERVERS}
      # Docker Desktop and generic local Compose do not provide Axern's
      # production cgroup delegation contract. Hard-limit qualification runs
      # in the dedicated Linux gates instead.
      AXNODED_CGROUP_ENFORCEMENT: disabled_dev
      AXNODED_MEMORY_SYSTEM_RESERVE_BYTES: "0"
      REGISTRY_PROXY_URL: ${REGISTRY_PROXY_URL}
      REGISTRY_NO_PROXY: ${CONTAINER_NO_PROXY}
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY}
      NO_PROXY: ${CONTAINER_NO_PROXY}
      http_proxy: ${CONTAINER_HTTP_PROXY}
      https_proxy: ${CONTAINER_HTTPS_PROXY}
      no_proxy: ${CONTAINER_NO_PROXY}
      IMAGEMGR_INSECURE_REGISTRIES: ${CONTROLD_INSECURE_REGISTRIES}
      AXNODED_ROOTFS_SNAPSHOT_REPOSITORY: registry:5000/axern/rootfs-snapshots
      AXERN_OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,axern.node_id=${AXNODED_CONTROL_PLANE_NODE_ID:-node-local}
    volumes:
      - "${AXERN_LOCAL_DIR}/run:/shared/run"
      - "${AXERN_LOCAL_DIR}/enrollment-token:/bootstrap/enrollment-token:ro"
      - "${AXERN_LOCAL_DIR}/certs/ca.crt:/certs/ca.crt:ro"
      - "${AXERN_LOCAL_DIR}/data/axnoded:/var/lib/axnoded"
      - "node-imagemgr-state:/var/lib/imagemgr"

  gatewayd:
    image: ${GATEWAYD_IMAGE}
    depends_on: [controld, node]
    restart: unless-stopped
    environment:
      GATEWAYD_CONTROL_TARGET: controld:24000
      GATEWAYD_CONTROL_EDGE_ADDRESS: 0.0.0.0:25000
      GATEWAYD_CONTROL_EDGE_TLS_CA_CERT: /certs/ca.crt
      GATEWAYD_CONTROL_EDGE_TLS_CERT: /certs/gatewayd.pem
      GATEWAYD_CONTROL_EDGE_TLS_KEY: /certs/gatewayd.pem
      GATEWAYD_TUNNEL_RELAY_TARGET: tunneld:24100
      GATEWAYD_TUNNEL_RELAY_TLS_CA_CERT: /certs/ca.crt
      GATEWAYD_HTTP_ADDRESS: 0.0.0.0:25080
      GATEWAYD_SSH_ENABLED: "true"
      GATEWAYD_SSH_ADDRESS: 0.0.0.0:25022
      GATEWAYD_SSH_HOST_KEY: /ssh/gateway_host_ed25519
      GATEWAYD_TLS_CA_CERT: /certs/ca.crt
      AXERN_WORKLOAD_CLUSTER: axern.local
      GATEWAYD_WORKLOAD_BUNDLE: /certs/gatewayd.pem
      AXERN_OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
    command: ["-control-target", "controld:24000", "-control-edge-address", "0.0.0.0:25000", "-control-edge-tls-ca-cert", "/certs/ca.crt", "-control-edge-tls-cert", "/certs/gatewayd.pem", "-control-edge-tls-key", "/certs/gatewayd.pem", "-tunnel-relay-target", "tunneld:24100", "-tunnel-relay-tls-ca-cert", "/certs/ca.crt", "-http-address", "0.0.0.0:25080", "-ssh-enabled", "-ssh-address", "0.0.0.0:25022", "-ssh-host-key", "/ssh/gateway_host_ed25519", "-tls-ca-cert", "/certs/ca.crt"]
    ports:
      - "127.0.0.1:${GATEWAY_CONTROL_PORT}:25000"
      - "127.0.0.1:${GATEWAY_HTTP_PORT}:25080"
      - "127.0.0.1:${GATEWAY_SSH_PORT}:25022"
    volumes:
      - "${AXERN_LOCAL_DIR}/certs/ca.crt:/certs/ca.crt:ro"
      - "${AXERN_LOCAL_DIR}/certs/gatewayd.pem:/certs/gatewayd.pem:ro"
      - "${AXERN_LOCAL_DIR}/ssh:/ssh:ro"

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["${AXERN_LOCAL_DIR}/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT}:4318"
    restart: unless-stopped
    depends_on: [otel-lgtm]

  otel-lgtm:
    image: ${OTEL_LGTM_IMAGE}
    profiles: [observability]
    ports: ["127.0.0.1:${LGTM_UI_PORT}:3000"]
    restart: unless-stopped
