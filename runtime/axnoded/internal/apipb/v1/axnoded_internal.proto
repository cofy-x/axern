syntax = "proto3";

package axnoded.internal.apipb.v1;

option go_package = "github.com/cofy-x/axern/runtime/axnoded/internal/apipb/v1;apipb";

import "axern/control/catalog/v1/catalog.proto";
import "axern/control/capability/v1/capability.proto";

enum RootfsSrcType {
  S3 = 0;
  IMAGE = 1;
  LOCAL = 2;
}

enum CgroupLifecycleState {
  CGROUP_LIFECYCLE_STATE_UNSPECIFIED = 0;
  CGROUP_LIFECYCLE_STATE_IDLE = 1;
  CGROUP_LIFECYCLE_STATE_ASSIGNED = 2;
  CGROUP_LIFECYCLE_STATE_RETIRING = 3;
}

enum CgroupLeaseOwnerKind {
  CGROUP_LEASE_OWNER_KIND_UNSPECIFIED = 0;
  CGROUP_LEASE_OWNER_KIND_WORKLOAD = 1;
  CGROUP_LEASE_OWNER_KIND_RUNTIME_CONFORMANCE = 2;
}

message CgroupLease {
  reserved 9;
  reserved "reclaim_requested_at_unix_nano";
  string cgroup_id = 1;
  CgroupLifecycleState state = 2;
  string allocation_id = 3;
  int64 memory_request_bytes = 4;
  int64 assigned_at_unix_nano = 5;
  int64 retiring_at_unix_nano = 6;
  string last_cleanup_error = 7;
  int64 current_charged_bytes = 8;
  int64 allocation_attempt = 10;
  int64 memory_limit_bytes = 11;
  string runtime_name = 12;
  string cgroup_boot_id = 13;
  string cgroup_mount_identity = 14;
  uint64 cgroup_parent_inode = 15;
  uint64 cgroup_leaf_inode = 16;
  string last_identity_verification_error = 17;
  CgroupLeaseOwnerKind owner_kind = 18;
  // Node admission charge, separated from the OCI workload request/limit so
  // trusted runtime monitor overhead can be reserved without weakening the
  // workload's cgroup boundary.
  int64 capacity_reservation_bytes = 19;
}

message CgroupLedger {
  repeated CgroupLease leases = 1;
  // Last node memory-capacity identity accepted by local admission. This stays
  // durable even when the current sample is invalidated so an axnoded restart
  // cannot make commitments from an older boot or cgroup mount admissible.
  string memory_capacity_identity = 2;
}

message DurableSequence {
  int64 reserved_through = 1;
}

message S3Config {
  string endpoint = 1;
  string bucket = 2;
  string object = 3;
  string accessKeyID = 4;
  string access_key_secret = 5;
}

message RootfsConfig {
  bool readonly = 1;
  RootfsSrcType type = 2;

  oneof source {
    string image_url = 3;
    S3Config s3_config = 4;
    string path = 5;
  }
}

message Mount {
  string type = 1;
  string source = 2;
  string target = 3;
  repeated string options = 4;
}

message ImageMount {
  string image = 1;
  string target = 2;
  bool readonly = 3;
}

message WorkspaceImageVariant {
  string format = 1;
  string image = 2;
}

message WorkspaceImageSource {
  repeated WorkspaceImageVariant variants = 1;
  string source_path = 2;
  string target = 3;
}

enum TaskAssetKind {
  TASK_ASSET_KIND_UNSPECIFIED = 0;
  TASK_ASSET_KIND_VERIFIER = 1;
  TASK_ASSET_KIND_ORACLE = 2;
}

message MaterializeTaskAssetsRequest {
  string ID = 1;
  string source_path = 2;
  string target = 3;
  TaskAssetKind kind = 4;
}

message MaterializeTaskAssetsResponse {
  int64 duration_ms = 1;
}

message RuntimeTemplate {
  string ID = 1;
  string sandbox = 2;
  RootfsConfig rootfs = 3;
  repeated string command = 4;
  map<string, string> runtimeEnvs = 5;
  string cwd = 6;
  repeated Mount mounts = 7;
  axern.control.catalog.v1.RuntimeExecutionProfile execution_profile = 8;
}

message AllocationState {
  string allocationID = 1;
  RuntimeTemplate runtime_template = 2;
  repeated string image_mount_urls = 3;
  string workspace_image_url = 4;
  string workspace_source_path = 5;
  string workspace_target = 6;
  repeated axern.control.capability.v1.CapabilityDependency capability_dependencies = 7;
  axern.control.capability.v1.CapabilityConditionSet capability_conditions = 8;
  AllocationEnforcementManifest enforcement_manifest = 9;
  AllocationCapabilityReconcileState capability_reconcile = 10;
  int64 allocation_attempt = 11;
  AllocationLaunchVerification launch_verification = 12;
  // Canonical digest of the behaviorally relevant StartRequest. It fences
  // same-attempt retries from mutating a running allocation's contract.
  string allocation_request_digest = 13;
  // Immutable post-create condition proof returned by idempotent Create
  // replays. capability_conditions remains the current runtime projection.
  axern.control.capability.v1.CapabilityConditionSet capability_admission_conditions = 14;
  AllocationEgressPolicyProof egress_policy_proof = 15;
}

message AllocationEgressPolicyProof {
  string sandbox_ip = 1;
  string policy_digest = 2;
  int64 execution_revision = 3;
}

// AllocationLaunchVerification is the durable create-time proof that the
// runtime-specific hard-enforcement contract was inspected while the OCI
// container was created but before the workload process was started. The
// immutable enforcement_manifest records what was launched; this record
// separately records which allocation requirements were actually verified.
message AllocationLaunchVerification {
  repeated axern.control.capability.v1.CapabilityKey verified_capabilities = 1;
  int64 verified_at_unix_nano = 2;
}

message PendingCapabilityReconcile {
  axern.control.capability.v1.CapabilityKey key = 1;
  int64 generation = 2;
}

// AllocationCapabilityReconcileState is a durable, allocation-scoped queue.
// Per-key generations make acknowledgement safe when a newer transition is
// merged while verification or termination is already running.
message AllocationCapabilityReconcileState {
  repeated PendingCapabilityReconcile pending = 1;
  bool terminating = 2;
  string last_error = 3;
  int64 updated_at_unix_nano = 4;
}

// AllocationEnforcementManifest is the immutable create-time contract used by
// runtime audits. Runtime-observed identities may be filled after create, but
// the requested limits and immutable launch contract never change.
message AllocationEnforcementManifest {
  string runtime_name = 1;
  int64 memory_limit_bytes = 2;
  int64 ephemeral_storage_limit_bytes = 3;
  string cgroup_path = 4;
  string runtime_cgroup_path = 5;
  string runsc_overlay_arg = 6;
  string filestore_mount_identity = 7;
  int64 created_at_unix_nano = 8;
  uint32 runc_project_id = 9;
  string bundle_path = 10;
  string runsc_backing_directory = 11;
  string runsc_backing_directory_identity = 12;
  string cgroup_boot_id = 13;
  string cgroup_mount_identity = 14;
  uint64 cgroup_parent_inode = 15;
  uint64 cgroup_leaf_inode = 16;
  int64 memory_swap_max_bytes = 17;
  bool memory_oom_group = 18;
  uint64 initial_memory_event_high = 19;
  uint64 initial_memory_event_max = 20;
  uint64 initial_memory_event_oom = 21;
  uint64 initial_memory_event_oom_kill = 22;
  uint64 initial_memory_event_oom_group_kill = 23;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message LinuxContainerResources {
  uint64 cpu_period = 1;
  int64 cpu_quota = 2;
  uint64 cpu_shares = 3;
  int64 memory_limit_in_bytes = 4;
  int64 oom_score_adj = 5;
  string cpuset_cpus = 6;
  string cpuset_mems = 7;
  repeated HugepageLimit hugepage_limits = 8;
  map<string, string> unified = 9;
  int64 memory_swap_limit_in_bytes = 10;
}

message HugepageLimit {
  string page_size = 1;
  uint64 limit = 2;
}

message Rootfs {
  string type = 1;
  string lower_dir = 2;
  string root_dir = 3;
  bool readonly = 4;
  reserved 5;
  ImmutableRootfsMount immutable_mount = 6;
}

// ImmutableRootfsMount is emitted by the rootfs source owner. OCI runtime
// projection consumes this bounded descriptor and never parses image-manager
// implementation details from mountinfo.
message ImmutableRootfsMount {
  string identity = 1;
  string filesystem = 2;
  repeated string backing_filesystems = 3;
  repeated string lower_dirs = 4;
  bool readonly = 5;
  string lease_id = 6;
  string effective_root = 7;
}

message ContainerMetadata {
  string ID = 1;
  string runtime_handler = 3;
  map<string, string> labels = 4;
  string stdout = 6;
  string stderr = 7;
}

message ContainerMetadataList {
  map<string, ContainerMetadata> containers = 1;
}

message Slice {
  repeated string items = 1;
}

message Map {
  map<string, string> items = 1;
}
