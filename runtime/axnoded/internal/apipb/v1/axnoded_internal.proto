syntax = "proto3";

package axnoded.internal.apipb.v1;

option go_package = "github.com/cofy-x/axern/runtime/axnoded/internal/apipb/v1;apipb";

import "axern/control/environment/v1/environment.proto";
import "axern/control/capability/v1/capability.proto";
import "axern/control/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

enum RootfsSrcType {
  UNSPECIFIED = 0;
  IMAGE = 1;
  LOCAL = 2;
}

enum CgroupLifecycleState {
  CGROUP_LIFECYCLE_STATE_UNSPECIFIED = 0;
  CGROUP_LIFECYCLE_STATE_IDLE = 1;
  CGROUP_LIFECYCLE_STATE_ASSIGNED = 2;
  CGROUP_LIFECYCLE_STATE_RETIRING = 3;
}

enum CgroupLeaseOwnerKind {
  CGROUP_LEASE_OWNER_KIND_UNSPECIFIED = 0;
  CGROUP_LEASE_OWNER_KIND_WORKLOAD = 1;
  CGROUP_LEASE_OWNER_KIND_RUNTIME_CONFORMANCE = 2;
}

message CgroupLease {
  string cgroup_id = 1;
  CgroupLifecycleState state = 2;
  string allocation_id = 3;
  int64 memory_request_bytes = 4;
  int64 assigned_at_unix_nano = 5;
  int64 retiring_at_unix_nano = 6;
  string last_cleanup_error = 7;
  int64 current_charged_bytes = 8;
  int64 memory_limit_bytes = 9;
  string cgroup_boot_id = 10;
  string cgroup_mount_identity = 11;
  uint64 cgroup_parent_inode = 12;
  uint64 cgroup_leaf_inode = 13;
  string last_identity_verification_error = 14;
  CgroupLeaseOwnerKind owner_kind = 15;
  // Node admission charge, separated from the OCI workload request/limit so
  // trusted runtime monitor overhead can be reserved without weakening the
  // workload's cgroup boundary.
  int64 capacity_charge_bytes = 16;
}

message CgroupLedger {
  repeated CgroupLease leases = 1;
  // Last node memory-capacity identity accepted by local admission. This stays
  // durable even when the current sample is invalidated so an axnoded restart
  // cannot make commitments from an older boot or cgroup mount admissible.
  string memory_capacity_identity = 2;
}

message RootfsConfig {
  bool readonly = 1;
  RootfsSrcType type = 2;

  oneof source {
    string image_url = 3;
    string path = 4;
  }
}

message Mount {
  string type = 1;
  string source = 2;
  string target = 3;
  repeated string options = 4;
}

message ImageMount {
  string image = 1;
  string target = 2;
  bool readonly = 3;
}

message ResolvedEnvironment {
  string id = 1;
  RootfsConfig rootfs = 2;
  repeated string argv = 3;
  map<string, string> env = 4;
  string cwd = 5;
  repeated Mount mounts = 6;
  axern.control.environment.v1.OciExecutionProfile execution_profile = 7;
}

// AllocationState is the sole node-local authority and recovery record for a
// control-plane-bound Allocation. Its node and request digest fence retries;
// runtime and kernel state are rebuildable projections of this record.
message AllocationState {
  string allocation_id = 1;
  string node_id = 2;
  ResolvedEnvironment environment = 3;
  axern.control.common.v1.ResourceSpec resources = 4;
  repeated string image_mount_urls = 5;
  repeated axern.control.capability.v1.CapabilityRequirement capability_requirements = 6;
  AllocationEnforcementManifest enforcement_manifest = 7;
  AllocationCapabilityReconcileState capability_reconcile = 8;
  // Canonical digest of the behaviorally relevant StartRequest. It fences
  // idempotent retries from mutating a running allocation's contract.
  string allocation_request_digest = 9;
  // Node-local receipt-clock deadline for the control plane's finite right to
  // keep this Allocation running. It is renewable and is not part of the
  // immutable create request digest.
  int64 execution_lease_expires_at_unix_nano = 10;
  axern.control.common.v1.WorkloadDiagnosticCode termination_diagnostic_code = 11;
  string termination_message = 12;
}

// AllocationCapabilityReconcileState is the durable node-local intent to
// re-evaluate an Allocation against the latest node-local capability
// observation. The sequence changes only when work is merged into this
// Allocation intent, so a worker cannot acknowledge over concurrent work.
message AllocationCapabilityReconcileState {
  int64 pending_intent_sequence = 1;
  bool terminating = 2;
  string last_error = 3;
}

// AllocationEnforcementManifest is the immutable create-time contract used by
// runtime audits. Runtime-observed identities may be filled after create, but
// the requested limits and immutable launch contract never change.
message AllocationEnforcementManifest {
  int64 memory_limit_bytes = 1;
  int64 ephemeral_storage_limit_bytes = 2;
  string cgroup_path = 3;
  string runtime_cgroup_path = 4;
  string runsc_overlay_arg = 5;
  string filestore_mount_identity = 6;
  int64 created_at_unix_nano = 7;
  string bundle_path = 8;
  string runsc_backing_directory = 9;
  string runsc_backing_directory_identity = 10;
  string cgroup_boot_id = 11;
  string cgroup_mount_identity = 12;
  uint64 cgroup_parent_inode = 13;
  uint64 cgroup_leaf_inode = 14;
  int64 memory_swap_max_bytes = 15;
  bool memory_oom_group = 16;
  uint64 initial_memory_event_high = 17;
  uint64 initial_memory_event_max = 18;
  uint64 initial_memory_event_oom = 19;
  uint64 initial_memory_event_oom_kill = 20;
  uint64 initial_memory_event_oom_group_kill = 21;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message LinuxContainerResources {
  uint64 cpu_period = 1;
  int64 cpu_quota = 2;
  uint64 cpu_shares = 3;
  int64 memory_limit_in_bytes = 4;
  int64 oom_score_adj = 5;
  string cpuset_cpus = 6;
  string cpuset_mems = 7;
  repeated HugepageLimit hugepage_limits = 8;
  map<string, string> unified = 9;
  int64 memory_swap_limit_in_bytes = 10;
}

// RuntimeCheckpoint is the minimal durable lifecycle barrier for one runsc
// container. Live identity is refreshed from runsc inventory; resource and
// admission facts belong to AllocationState and the resource ledgers.
enum RuntimeCheckpointState {
  RUNTIME_CHECKPOINT_STATE_UNKNOWN = 0;
  RUNTIME_CHECKPOINT_STATE_RUNNING = 1;
  RUNTIME_CHECKPOINT_STATE_EXITED = 2;
}

message RuntimeCheckpoint {
  RuntimeCheckpointState state = 1;
  int32 init_process_pid = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  optional int32 exit_code = 5;
  string message = 6;
  axern.control.common.v1.WorkloadDiagnosticCode diagnostic_code = 7;
}

message HugepageLimit {
  string page_size = 1;
  uint64 limit = 2;
}

message Rootfs {
  string type = 1;
  string lower_dir = 2;
  string root_dir = 3;
  bool readonly = 4;
  ImmutableRootfsMount immutable_mount = 5;
}

// ImmutableRootfsMount is emitted by the rootfs source owner. OCI runtime
// projection consumes this bounded descriptor and never parses image-manager
// implementation details from mountinfo.
message ImmutableRootfsMount {
  string identity = 1;
  string filesystem = 2;
  repeated string backing_filesystems = 3;
  repeated string lower_dirs = 4;
  bool readonly = 5;
  string lease_id = 6;
  string effective_root = 7;
}

message ContainerMetadata {
  string stdout = 1;
  string stderr = 2;
}

// NetworkLease is the durable owner binding for one host network resource.
// The Allocation ID, rather than an OCI annotation, authorizes lookup and
// cleanup after restart.
message NetworkLease {
  string allocation_id = 1;
  string host_interface_name = 2;
  string ip = 3;
  string netns_path = 4;
}

message NetworkLedger {
  repeated NetworkLease leases = 1;
}
