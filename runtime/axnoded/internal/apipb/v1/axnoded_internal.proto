syntax = "proto3";

package axnoded.internal.apipb.v1;

option go_package = "github.com/cofy-x/axern/runtime/axnoded/internal/apipb/v1;apipb";

import "axern/control/catalog/v1/catalog.proto";
import "axern/control/capability/v1/capability.proto";

enum RootfsSrcType {
  UNSPECIFIED = 0;
  IMAGE = 1;
  LOCAL = 2;
}

enum CgroupLifecycleState {
  CGROUP_LIFECYCLE_STATE_UNSPECIFIED = 0;
  CGROUP_LIFECYCLE_STATE_IDLE = 1;
  CGROUP_LIFECYCLE_STATE_ASSIGNED = 2;
  CGROUP_LIFECYCLE_STATE_RETIRING = 3;
}

enum CgroupLeaseOwnerKind {
  CGROUP_LEASE_OWNER_KIND_UNSPECIFIED = 0;
  CGROUP_LEASE_OWNER_KIND_WORKLOAD = 1;
  CGROUP_LEASE_OWNER_KIND_RUNTIME_CONFORMANCE = 2;
}

message CgroupLease {
  string cgroup_id = 1;
  CgroupLifecycleState state = 2;
  string allocation_id = 3;
  int64 memory_request_bytes = 4;
  int64 assigned_at_unix_nano = 5;
  int64 retiring_at_unix_nano = 6;
  string last_cleanup_error = 7;
  int64 current_charged_bytes = 8;
  int64 memory_limit_bytes = 9;
  string runtime_name = 10;
  string cgroup_boot_id = 11;
  string cgroup_mount_identity = 12;
  uint64 cgroup_parent_inode = 13;
  uint64 cgroup_leaf_inode = 14;
  string last_identity_verification_error = 15;
  CgroupLeaseOwnerKind owner_kind = 16;
  // Node admission charge, separated from the OCI workload request/limit so
  // trusted runtime monitor overhead can be reserved without weakening the
  // workload's cgroup boundary.
  int64 capacity_reservation_bytes = 17;
}

message CgroupLedger {
  repeated CgroupLease leases = 1;
  // Last node memory-capacity identity accepted by local admission. This stays
  // durable even when the current sample is invalidated so an axnoded restart
  // cannot make commitments from an older boot or cgroup mount admissible.
  string memory_capacity_identity = 2;
}

message DurableSequence {
  int64 reserved_through = 1;
}

message RootfsConfig {
  bool readonly = 1;
  RootfsSrcType type = 2;

  oneof source {
    string image_url = 3;
    string path = 4;
  }
}

message Mount {
  string type = 1;
  string source = 2;
  string target = 3;
  repeated string options = 4;
}

message ImageMount {
  string image = 1;
  string target = 2;
  bool readonly = 3;
}

message RuntimeTemplate {
  string ID = 1;
  string sandbox = 2;
  RootfsConfig rootfs = 3;
  repeated string command = 4;
  map<string, string> runtimeEnvs = 5;
  string cwd = 6;
  repeated Mount mounts = 7;
  axern.control.catalog.v1.RuntimeExecutionProfile execution_profile = 8;
}

message AllocationState {
  string allocationID = 1;
  RuntimeTemplate runtime_template = 2;
  repeated string image_mount_urls = 3;
  repeated axern.control.capability.v1.CapabilityRequirement capability_requirements = 4;
  AllocationEnforcementManifest enforcement_manifest = 5;
  AllocationCapabilityReconcileState capability_reconcile = 6;
  AllocationLaunchVerification launch_verification = 7;
  // Canonical digest of the behaviorally relevant StartRequest. It fences
  // idempotent retries from mutating a running allocation's contract.
  string allocation_request_digest = 8;
}

// ControlPlaneAllocationBinding is the sole authoritative node-local record
// that controld admitted an Allocation to this node. Runtime state, OCI metadata, cgroup
// ownership, and AllocationState existence never substitute for this relation.
message ControlPlaneAllocationBinding {
  string allocation_id = 1;
  string node_id = 2;
  string request_digest = 3;
}

// AllocationLaunchVerification is the durable create-time record that the
// runtime-specific hard-enforcement contract was inspected while the OCI
// container was created but before the workload process was started. The
// immutable enforcement_manifest records what was launched; this record
// separately records which allocation requirements were actually verified.
message AllocationLaunchVerification {
  repeated axern.control.capability.v1.CapabilityKey verified_capabilities = 1;
  int64 verified_at_unix_nano = 2;
}

// AllocationCapabilityReconcileState is the durable node-local intent to
// re-evaluate an Allocation against the latest node observation. The sequence
// is the CapabilitySnapshot order; there is no second capability generation.
message AllocationCapabilityReconcileState {
  int64 pending_observation_sequence = 1;
  bool terminating = 2;
  string last_error = 3;
}

// AllocationEnforcementManifest is the immutable create-time contract used by
// runtime audits. Runtime-observed identities may be filled after create, but
// the requested limits and immutable launch contract never change.
message AllocationEnforcementManifest {
  string runtime_name = 1;
  int64 memory_limit_bytes = 2;
  int64 ephemeral_storage_limit_bytes = 3;
  string cgroup_path = 4;
  string runtime_cgroup_path = 5;
  string runsc_overlay_arg = 6;
  string filestore_mount_identity = 7;
  int64 created_at_unix_nano = 8;
  string bundle_path = 9;
  string runsc_backing_directory = 10;
  string runsc_backing_directory_identity = 11;
  string cgroup_boot_id = 12;
  string cgroup_mount_identity = 13;
  uint64 cgroup_parent_inode = 14;
  uint64 cgroup_leaf_inode = 15;
  int64 memory_swap_max_bytes = 16;
  bool memory_oom_group = 17;
  uint64 initial_memory_event_high = 18;
  uint64 initial_memory_event_max = 19;
  uint64 initial_memory_event_oom = 20;
  uint64 initial_memory_event_oom_kill = 21;
  uint64 initial_memory_event_oom_group_kill = 22;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message LinuxContainerResources {
  uint64 cpu_period = 1;
  int64 cpu_quota = 2;
  uint64 cpu_shares = 3;
  int64 memory_limit_in_bytes = 4;
  int64 oom_score_adj = 5;
  string cpuset_cpus = 6;
  string cpuset_mems = 7;
  repeated HugepageLimit hugepage_limits = 8;
  map<string, string> unified = 9;
  int64 memory_swap_limit_in_bytes = 10;
}

message HugepageLimit {
  string page_size = 1;
  uint64 limit = 2;
}

message Rootfs {
  string type = 1;
  string lower_dir = 2;
  string root_dir = 3;
  bool readonly = 4;
  ImmutableRootfsMount immutable_mount = 5;
}

// ImmutableRootfsMount is emitted by the rootfs source owner. OCI runtime
// projection consumes this bounded descriptor and never parses image-manager
// implementation details from mountinfo.
message ImmutableRootfsMount {
  string identity = 1;
  string filesystem = 2;
  repeated string backing_filesystems = 3;
  repeated string lower_dirs = 4;
  bool readonly = 5;
  string lease_id = 6;
  string effective_root = 7;
}

enum ContainerRecoveryMode {
  CONTAINER_RECOVERY_MODE_UNSPECIFIED = 0;
  // The runtime container may survive axnoded restart, but only an independent
  // admitted owner is allowed to restore it.
  CONTAINER_RECOVERY_MODE_DURABLE = 1;
  // The runtime container belongs to an in-process session or self-test and
  // must be removed after a process restart because its owner no longer exists.
  CONTAINER_RECOVERY_MODE_DISCARD_ON_RESTART = 2;
}

message ContainerMetadata {
  string runtime_handler = 1;
  map<string, string> labels = 2;
  string stdout = 3;
  string stderr = 4;
  ContainerRecoveryMode recovery_mode = 5;
}

message Slice {
  repeated string items = 1;
}

message Map {
  map<string, string> items = 1;
}
