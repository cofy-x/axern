syntax = "proto3";

package axnoded.internal.apipb.v1;

option go_package = "github.com/cofy-x/axern/runtime/axnoded/internal/apipb/v1;apipb";

import "internal/apipb/v1/axnoded_internal.proto";
import "axern/control/common/v1/common.proto";
import "axern/control/capability/v1/capability.proto";

message StartRequest {
  ResolvedEnvironment environment = 1;
  repeated Mount mounts = 2;
  axern.control.common.v1.ResourceSpec resources = 3;
  map<string, string> env = 4;
  string stdout = 5;
  string stderr = 6;
  RegistryCredential registry_credential = 7;
  repeated ResolvedSecretEnvVar secret_env = 8;
  repeated ResolvedSecretFile secret_files = 9;
  axern.control.common.v1.NetworkSpec network = 10;
  string trace_id = 11;
  repeated axern.control.common.v1.PortSpec ports = 12;
  string allocation_id = 13;
  repeated ImageMount image_mounts = 14;
  repeated axern.control.capability.v1.CapabilityRequirement capability_requirements = 15;
  repeated axern.control.capability.v1.ExtensionCapabilityRequirement extension_capability_requirements = 16;
}

message RegistryCredential {
  string docker_config_json = 1;
}

message ResolvedSecretEnvVar {
  string name = 1;
  string value = 2;
}

message ResolvedSecretFile {
  string path = 1;
  bytes content = 2;
  uint32 mode = 3;
}

message StartResponse {
  string allocation_id = 1;
  axern.control.capability.v1.CapabilityConditionSet capability_verification = 2;
}

message DeleteRequest {
  string id = 1;
  int64 timeout = 2;
}

message DeleteResponse {}

message KillRequest {
  string id = 1;
  string signal = 2;
}

message KillResponse {}

message WaitRequest {
  string id = 1;
}

message WaitResponse {
  optional int32 exit_code = 1;
  string message = 2;
}

message ListContainersRequest {
  string id = 1;
}

message ListContainersResponse {
  repeated ContainerStatus containers = 1;
}

enum ContainerState {
  CONTAINER_UNKNOWN = 0;
  CONTAINER_RUNNING = 1;
  CONTAINER_EXITED = 2;
}

message ContainerStatus {
  string id = 1;
  ContainerState state = 2;
  int64 started_at = 3;
  int64 finished_at = 4;
  optional int32 exit_code = 5;
  string message = 6;
  string stdout = 7;
  string stderr = 8;
  int32 pid = 9;
  axern.control.common.v1.WorkloadDiagnosticCode diagnostic_code = 10;
}

message VersionRequest {
  string version = 1;
}

message VersionResponse {
  string version = 1;
  RuntimeVersion runsc = 2;
}

message RuntimeVersion {
  string version = 1;
}

message StatsRequest {
  string id = 1;
}

message StatsResponse {
  uint64 cpu_usage_ns = 1;
  uint64 memory_usage_bytes = 2;
  uint64 memory_limit_bytes = 3;
  uint64 memory_max_usage_bytes = 4;
  uint64 cpu_kernel_ns = 5;
  uint64 cpu_user_ns = 6;
}
