syntax = "proto3";

package axnoded.internal.apipb.v1;

option go_package = "github.com/cofy-x/axern/runtime/axnoded/internal/apipb/v1;apipb";

import "internal/apipb/v1/axnoded_internal.proto";
import "axern/control/common/v1/common.proto";
import "axern/control/capability/v1/capability.proto";

message StartRequest {
  RuntimeTemplate runtime_template = 1;
  repeated Mount mounts = 2;
  axern.control.common.v1.ResourceSpec resources = 3;
  map<string, string> userEnvs = 4;
  string stdout = 5;
  string stderr = 6;
  string extra_config = 7;
  string network = 8;
  string ckptDir = 9;
  string trace_id = 10;
  repeated string ports = 11;
  string containerID = 12;
  repeated ImageMount image_mounts = 13;
  repeated axern.control.capability.v1.CapabilityRequirement capability_requirements = 14;
  repeated axern.control.capability.v1.ExtensionCapabilityRequirement extension_capability_requirements = 15;
  // The normalized public policy is carried intact to the node-local
  // enforcement boundary. The string network field is the OCI network-mode
  // selector and must never be used as a policy surrogate.
  axern.control.common.v1.NetworkEgressPolicy egress_policy = 16;
}

message StartResponse {
  int32 code = 1;
  string message = 2;
  string ID = 3;
  axern.control.capability.v1.CapabilityConditionSet capability_verification = 4;
}

message DeleteRequest {
  string ID = 1;
  int64 timeout = 2;
}

message DeleteResponse {}

message KillRequest {
  string ID = 1;
  string signal = 2;
}

message KillResponse {}

message WaitRequest {
  string ID = 1;
}

message WaitResponse {
  int32 status = 1;
  int32 exit_code = 2;
  string message = 3;
}

message CheckpointRequest {
  string ID = 1;
  string ckptDir = 2;
  int64 timeout = 3;
  bool compress = 4;
  string trace_id = 5;
}

message CheckpointResponse {
  bool success = 1;
  string message = 2;
}

message ListContainersRequest {
  string ID = 1;
  map<string, string> selector = 2;
}

message ListContainersResponse {
  repeated ContainerStatus containers = 1;
}

enum ContainerState {
  CONTAINER_RUNNING = 0;
  CONTAINER_EXITED = 1;
  CONTAINER_UNKNOWN = 2;
}

message ContainerStatus {
  string ID = 1;
  repeated string command = 2;
  ContainerState state = 3;
  int64 started_at = 4;
  int64 finished_at = 5;
  int32 exit_code = 6;
  string message = 7;
  map<string, string> labels = 8;
  repeated Mount mounts = 9;
  repeated KeyValue envs = 10;
  string stdout = 11;
  string stderr = 12;
  LinuxContainerResources linux_resources = 13;
  int32 pid = 14;
  axern.control.common.v1.WorkloadDiagnosticCode diagnostic_code = 15;
}

message VersionRequest {
  string version = 1;
}

message VersionResponse {
  string version = 1;
  RuntimeVersion runsc = 2;
}

message RuntimeVersion {
  string version = 1;
}

message StatsRequest {
  string ID = 1;
}

message StatsResponse {
  uint64 cpu_usage_ns = 1;
  uint64 memory_usage_bytes = 2;
  uint64 memory_limit_bytes = 3;
  uint64 memory_max_usage_bytes = 4;
  uint64 cpu_kernel_ns = 5;
  uint64 cpu_user_ns = 6;
}
