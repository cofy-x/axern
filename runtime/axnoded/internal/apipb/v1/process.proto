syntax = "proto3";

package axnoded.internal.apipb.v1;

option go_package = "github.com/cofy-x/axern/runtime/axnoded/internal/apipb/v1;apipb";

import "internal/apipb/v1/axnoded_internal.proto";

message ExecRequest {
  string ID = 1;
  repeated string command = 2;
  int64 timeout = 3;
  map<string, string> env = 4;
  string cwd = 5;
  string user = 6;
}

message ExecResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  bool stdout_truncated = 4;
  bool stderr_truncated = 5;
}

message ExecStreamOpen {
  string ID = 1;
  repeated string command = 2;
  bool tty = 3;
  int64 timeout = 4;
  map<string, string> env = 5;
  string cwd = 6;
  string user = 7;
  TerminalResize initial_size = 8;
}

message ExecStreamRequest {
  oneof payload {
    ExecStreamOpen open = 1;
    bytes stdin = 2;
    TerminalResize resize = 3;
    bool close_stdin = 4;
  }
}

message ExecExit {
  int32 exit_code = 1;
  string message = 2;
}

message ExecStreamResponse {
  oneof payload {
    bytes stdout = 1;
    bytes stderr = 2;
    ExecExit exit = 3;
  }
}

message ProcessOpen {
  string ID = 1;
  repeated string command = 2;
  bool tty = 3;
  int64 timeout = 4;
  map<string, string> env = 5;
  string cwd = 6;
  string user = 7;
}

message ProcessSignal {
  string signal = 1;
}

message ProcessReady {}

message ProcessRequest {
  oneof payload {
    ProcessOpen open = 1;
    bytes stdin = 2;
    TerminalResize resize = 3;
    bool close_stdin = 4;
    ProcessSignal signal = 5;
  }
}

message ProcessResponse {
  oneof payload {
    bytes stdout = 1;
    bytes stderr = 2;
    ExecExit exit = 3;
    ProcessReady ready = 4;
  }
}
