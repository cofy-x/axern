services:
  oss:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    platform: ${VERIFY_DOCKER_PLATFORM}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      default:
        aliases:
          - axnoded-e2e.oss

  node:
    image: ${IMAGE_TAG:-axnoded-verify:latest}
    platform: ${VERIFY_DOCKER_PLATFORM}
    privileged: true
    depends_on:
      - oss
    environment:
      IMAGEMGR_SOCKET: /run/imagemgr/imagemgr.sock
      AXNODED_SOCKET: /run/axnoded/axnoded.sock
      AXNODED_HTTP_ADDRESS: 0.0.0.0:23001
      MINIO_ENDPOINT: oss:9000
      OBJECT_STORE_SCHEME: http
      OBJECT_STORE_REGION: us-east-1
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: axnoded-e2e
    command: ["/bin/bash", "/workspace/scripts/verify/node-all-in-one-entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /run/imagemgr/imagemgr.sock && curl -fsS http://127.0.0.1:23001/readyz >/dev/null
      interval: 3s
      timeout: 3s
      retries: 40
