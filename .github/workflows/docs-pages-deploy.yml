name: Documentation Pages Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/docs-pages-deploy.yml

permissions:
  contents: read

concurrency:
  group: axern-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Axern docs to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://axern.cofy-x.space

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.16.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: "10.24.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publishable documentation
        run: make docs-verify

      - name: Resolve Cloudflare Pages project
        id: pages
        shell: bash
        env:
          CONFIGURED_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          project="${CONFIGURED_PROJECT:-axern-docs}"
          printf 'project=%s\n' "${project}" >> "${GITHUB_OUTPUT}"

      - name: Deploy static site with pinned Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ steps.pages.outputs.project }}
        run: |
          set -euo pipefail
          pnpm --filter @cofy-x/axern-docs exec wrangler --version
          pnpm --filter @cofy-x/axern-docs exec wrangler pages deploy dist \
            --project-name="${CLOUDFLARE_PAGES_PROJECT}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}"
