name: DCO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify commit sign-offs
        run: |
          git rev-parse --verify 'origin/main^{commit}' >/dev/null
          bash scripts/check-dco.sh origin/main "${GITHUB_SHA}"
