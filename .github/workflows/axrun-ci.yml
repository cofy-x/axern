name: Axrun CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/axrun/**"
      - "scripts/axrun/**"
      - "sdk/go/**"
      - "sdk/proto/**"
      - "mk/axrun.mk"
      - ".github/workflows/axrun-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/axrun/**"
      - "scripts/axrun/**"
      - "sdk/go/**"
      - "sdk/proto/**"
      - "mk/axrun.mk"
      - ".github/workflows/axrun-ci.yml"

permissions:
  contents: read

jobs:
  axrun-gates:
    name: Axrun Gates
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            apps/axrun/go.sum
            sdk/go/go.sum

      - name: Bootstrap Go dependencies
        run: make bootstrap-go

      - name: Axrun checks
        run: make axrun-check
