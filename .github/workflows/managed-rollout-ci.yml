name: Managed Rollout CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/axrun/**"
      - "control/**"
      - "gateway/**"
      - "lib/**"
      - "network/**"
      - "runtime/**"
      - "sdk/go/**"
      - "sdk/proto/**"
      - "deploy/images/**"
      - "deploy/local/**"
      - "scripts/axrun/**"
      - "scripts/dev-env/**"
      - "Makefile"
      - "mk/axrun.mk"
      - "mk/dev-env.mk"
      - "mk/root.mk"
      - "go.work"
      - "go.work.sum"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/managed-rollout-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/axrun/**"
      - "control/**"
      - "gateway/**"
      - "lib/**"
      - "network/**"
      - "runtime/**"
      - "sdk/go/**"
      - "sdk/proto/**"
      - "deploy/images/**"
      - "deploy/local/**"
      - "scripts/axrun/**"
      - "scripts/dev-env/**"
      - "Makefile"
      - "mk/axrun.mk"
      - "mk/dev-env.mk"
      - "mk/root.mk"
      - "go.work"
      - "go.work.sum"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/managed-rollout-ci.yml"

permissions:
  contents: read

concurrency:
  group: managed-rollout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-rollout:
    name: Managed Rollout Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AXERN_MANAGED_ROLLOUT_PRUNE_BUILD_CACHE: "1"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            apps/axrun/go.sum
            control/controld/go.sum
            control/storaged/go.sum
            gateway/gatewayd/go.sum
            lib/go/grpcclient/go.sum
            lib/go/observability/go.sum
            runtime/axnoded/go.sum
            runtime/imagemgr/go.sum
            runtime/tunneld/go.sum
            sdk/go/go.sum

      - name: Bootstrap Go dependencies
        run: make bootstrap-go

      - name: Resolve runner DNS for nested sandboxes
        shell: python
        run: |
          import ipaddress
          import os
          from pathlib import Path

          resolvers = []
          for path in (Path("/etc/resolv.conf"), Path("/run/systemd/resolve/resolv.conf")):
              try:
                  lines = path.read_text(encoding="utf-8").splitlines()
              except OSError:
                  continue
              for line in lines:
                  fields = line.split()
                  if len(fields) < 2 or fields[0] != "nameserver":
                      continue
                  try:
                      address = ipaddress.ip_address(fields[1])
                  except ValueError:
                      continue
                  if address.is_loopback or address.is_unspecified:
                      continue
                  value = str(address)
                  if value not in resolvers:
                      resolvers.append(value)

          if not resolvers:
              raise SystemExit("runner has no non-loopback DNS resolver for nested sandboxes")

          value = ",".join(resolvers)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"AXNODED_DNS_NAMESERVERS={value}\n")
          print(f"nested_sandbox_dns_nameserver_count={len(resolvers)}")

      - name: Managed rollout verification
        run: make axrun-managed-rollout-compose-e2e

      - name: Report runner resources after failure
        if: failure()
        run: |
          df -h
          docker system df -v || true
          docker ps -a --size || true
