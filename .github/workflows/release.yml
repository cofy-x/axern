name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Helm
        run: |
          bash scripts/release/install-helm.sh "${RUNNER_TEMP}/bin/helm"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: false
      - name: Validate release contract
        run: make release-check

  artifacts:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Helm
        run: |
          bash scripts/release/install-helm.sh "${RUNNER_TEMP}/bin/helm"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: false
      - name: Install Syft
        run: |
          archive="${RUNNER_TEMP}/syft.tar.gz"
          curl --fail --location --retry 3 --output "${archive}" \
            https://github.com/anchore/syft/releases/download/v1.49.0/syft_1.49.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe \
            "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" syft
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Build CLI and Helm artifacts
        run: make release-build
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/release/*
          if-no-files-found: error

  sdk-artifacts:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.16.0"
      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: "10.24.0"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify SDK artifacts
        run: make sdk-artifact-verify
      - name: Upload SDK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-artifacts
          path: |
            dist/sdk/python/*
            dist/sdk/typescript/*
            dist/sdk/checksums.txt
          if-no-files-found: error

  images:
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture images
        run: bash scripts/release/build-and-push-images.sh "${{ matrix.arch }}"

  candidate-acceptance:
    needs: [artifacts, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Helm
        run: |
          bash scripts/release/install-helm.sh "${RUNNER_TEMP}/bin/helm"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: dist/release
      - name: Install candidate CLI
        env:
          AXERN_RELEASE_DOWNLOAD_BASE: file://${{ github.workspace }}/dist/release
        run: bash scripts/release/install-cli.sh "${RUNNER_TEMP}/bin/axern"
      - name: Verify candidate chart, images, and CLI
        env:
          AXERN_CLI_BINARY: ${{ runner.temp }}/bin/axern
          AXERN_RELEASE_IMAGE_TAG_SUFFIX: amd64
          AXERN_REGISTRY_USERNAME: ${{ github.actor }}
          AXERN_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          chart="dist/release/axern-$(cat VERSION).tgz"
          AXERN_HELM_CHART="${GITHUB_WORKSPACE}/${chart}" \
            bash scripts/release/kind-acceptance.sh

  sdk-publish:
    needs: [sdk-artifacts, candidate-acceptance]
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.16.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Download SDK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-artifacts
          path: dist/sdk
      - name: Reconcile immutable SDK versions
        id: preflight
        run: bash scripts/release/sdk-preflight.sh
      - name: Publish Python SDK to PyPI
        if: steps.preflight.outputs.publish_python == 'true'
        run: uv publish --trusted-publishing always dist/sdk/python/*
      - name: Publish TypeScript SDK to npm
        if: steps.preflight.outputs.publish_typescript == 'true'
        run: npm publish dist/sdk/typescript/*.tgz --access public

  publish:
    needs: [artifacts, images, candidate-acceptance, sdk-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Helm
        run: |
          bash scripts/release/install-helm.sh "${RUNNER_TEMP}/bin/helm"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: dist/release
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log Helm in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Verify immutable release names are unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/preflight.sh
      - name: Publish multi-architecture image manifests
        run: bash scripts/release/publish-image-manifests.sh
      - name: Publish Helm OCI chart
        run: helm push "dist/release/axern-$(cat VERSION).tgz" oci://ghcr.io/cofy-x/charts
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/release/*
      - name: Publish GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --verify-tag --generate-notes --title "Axern ${GITHUB_REF_NAME}"

  acceptance:
    needs: [publish, sdk-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Helm
        run: |
          bash scripts/release/install-helm.sh "${RUNNER_TEMP}/bin/helm"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.16.0"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Install released CLI
        run: bash scripts/release/install-cli.sh "${RUNNER_TEMP}/bin/axern"
      - name: Verify released chart, images, and CLI
        env:
          AXERN_CLI_BINARY: ${{ runner.temp }}/bin/axern
        run: bash scripts/release/kind-acceptance.sh
      - name: Verify released SDKs from public registries
        run: bash scripts/release/verify-published-sdks.sh
