name: Native archive provenance

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full commit SHA on the default branch (empty uses the dispatch commit)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          path: tooling
      - name: Select the exact candidate
        env:
          CANDIDATE: ${{ inputs.candidate_commit || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C tooling cat-file -t "$CANDIDATE")" = commit
          git -C tooling merge-base --is-ancestor "$CANDIDATE" "$GITHUB_SHA"
          git -C tooling worktree add --detach "$GITHUB_WORKSPACE/candidate" "$CANDIDATE"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: candidate/go.work
          cache: false
      - name: Build and verify the native archive
        env:
          CANDIDATE: ${{ inputs.candidate_commit || github.sha }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          source candidate/runtime/axnoded/gvisor.lock
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            "https://storage.googleapis.com/gvisor/releases/release/${AXERN_GVISOR_RELEASE}/${EXPECTED_MACHINE}/gvisor.tar.bz2" \
            -o "$RUNNER_TEMP/gvisor.tar.bz2"
          (cd candidate && python3 scripts/release/native_runtime.py build --gvisor-archive "$RUNNER_TEMP/gvisor.tar.bz2" \
            --output-dir "$RUNNER_TEMP/archives") > "$RUNNER_TEMP/build.json"
          archive=$(jq -er '.archive' "$RUNNER_TEMP/build.json")
          digest=$(jq -er '.sha256' "$RUNNER_TEMP/build.json")
          python3 tooling/scripts/release/native_runtime.py verify "$archive" --sha256 "$digest" | \
            jq -e --arg sha "$CANDIDATE" --arg arch "$EXPECTED_ARCH" \
              '.status == "verified" and .source_revision == $sha and .architecture == $arch'
          bash tooling/scripts/release/install-image-auditors.sh "$RUNNER_TEMP/scanner" syft
          python3 tooling/scripts/release/native_delivery_inventory.py "$archive" --sha256 "$digest" \
            --syft "$RUNNER_TEMP/scanner/syft" --output-dir "$RUNNER_TEMP/evidence"
          printf '%s  %s\n' "$digest" "$(basename "$archive")" > "$RUNNER_TEMP/evidence/SHA256SUMS"
      - name: Transfer the inventory to the signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-inventory-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/evidence/receipt.json
            ${{ runner.temp }}/evidence/runtime.spdx.json
            ${{ runner.temp }}/evidence/runtime.cdx.json
            ${{ runner.temp }}/evidence/SHA256SUMS
          if-no-files-found: error

  sign:
    needs: build
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-inventory-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence
      - name: Check the source and collect the subjects
        working-directory: ${{ runner.temp }}/evidence
        env:
          CANDIDATE: ${{ inputs.candidate_commit || github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          jq -e --arg sha "$CANDIDATE" --arg arch "$ARCH" '
            .schema == "axern.native-delivery-inventory.v1" and
            .source_revision == $sha and .architecture == $arch and
            (.version | test("\\A[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.-]+)?\\z")) and
            (.archive_sha256 | test("\\A[0-9a-f]{64}\\z")) and
            (.inventory_sha256 | keys == ["runtime.cdx.json", "runtime.spdx.json"]) and
            (.inventory_sha256 | all(.[]; test("\\A[0-9a-f]{64}\\z")))
          ' receipt.json
          archive=$(jq -er '"axern-runtime_\(.version)_linux_\(.architecture).tar.gz"' receipt.json)
          digest=$(jq -er '.archive_sha256' receipt.json)
          printf '%s  %s\n' "$digest" "$archive" | cmp - SHA256SUMS
          jq -er '.inventory_sha256 | to_entries[] | "\(.value)  \(.key)"' receipt.json | sha256sum --check --strict
          cat SHA256SUMS > "$RUNNER_TEMP/subjects.sha256"
          sha256sum SHA256SUMS receipt.json runtime.spdx.json runtime.cdx.json >> "$RUNNER_TEMP/subjects.sha256"
      - name: Attest the archive and exact inventory
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256
      - name: Collect the signed bundle
        env:
          ATTESTATION: ${{ steps.provenance.outputs.bundle-path }}
        run: install -m 0644 "$ATTESTATION" "$RUNNER_TEMP/evidence/provenance.jsonl"
      - name: Retain the signed build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evidence-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
